name: Bundle public media evidence

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/bundle-public-media.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Upload recovered evidence set
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: public-media-evidence
          path: public-media-analysis
          if-no-files-found: error
          retention-days: 1
      - name: Persist artifact coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('public-media-analysis/bundle-run.json').write_text(json.dumps({
              'run_id': int(os.environ['RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_url': os.environ.get('ARTIFACT_URL', ''),
          }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/bundle-run.json
          git commit -m 'research: record public media evidence artifact'
          git push origin HEAD:research/public-media-analysis
