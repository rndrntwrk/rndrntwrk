name: Capture public Genesis Kindle sample reader

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/capture-genesis-reader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Capture bounded public sample session
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const out = 'public-media-analysis/reader-capture';
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(path.join(out, 'responses'), { recursive: true });
          fs.mkdirSync(path.join(out, 'screens'), { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36',
            locale: 'en-US',
          });
          const page = await context.newPage();
          const network = [];
          const errors = [];
          const interesting = (url) =>
            url.includes('B0FK7RBDFL') ||
            url.includes('d3lzhnl3ghk4fg.cloudfront.net') ||
            url.includes('/reader-api') ||
            url.includes('/sample/api/') ||
            url.includes('karamel') ||
            url.includes('rsrc');

          page.on('requestfailed', req => errors.push({ type: 'requestfailed', url: req.url(), failure: req.failure() }));
          page.on('pageerror', err => errors.push({ type: 'pageerror', message: String(err), stack: err?.stack || null }));
          page.on('console', msg => {
            if (msg.type() === 'error' || msg.type() === 'warning') errors.push({ type: `console-${msg.type()}`, text: msg.text() });
          });
          page.on('response', async response => {
            const req = response.request();
            const headers = await response.allHeaders().catch(() => ({}));
            const record = {
              url: response.url(),
              status: response.status(),
              method: req.method(),
              resourceType: req.resourceType(),
              contentType: headers['content-type'] || '',
              contentLength: headers['content-length'] || null,
              postData: interesting(response.url()) ? req.postData() : null,
            };
            network.push(record);
            if (!interesting(response.url()) || response.status() >= 400) return;
            try {
              const body = await response.body();
              if (body.length > 20 * 1024 * 1024) return;
              const hash = crypto.createHash('sha256').update(response.url()).digest('hex').slice(0, 16);
              let ext = '.bin';
              const ct = record.contentType;
              if (ct.includes('json')) ext = '.json';
              else if (ct.includes('javascript')) ext = '.js';
              else if (ct.includes('html')) ext = '.html';
              else if (ct.includes('png')) ext = '.png';
              else if (ct.includes('jpeg') || ct.includes('jpg')) ext = '.jpg';
              else if (ct.includes('svg')) ext = '.svg';
              else if (ct.includes('text')) ext = '.txt';
              fs.writeFileSync(path.join(out, 'responses', `${hash}${ext}`), body);
              fs.writeFileSync(path.join(out, 'responses', `${hash}.meta.json`), JSON.stringify(record, null, 2));
            } catch (e) {
              errors.push({ type: 'response-body', url: response.url(), error: String(e) });
            }
          });

          const url = 'https://read.amazon.com/sample/B0FK7RBDFL?clientId=share';
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForTimeout(20000);
          await page.screenshot({ path: path.join(out, 'screens', 'initial.png'), fullPage: true });

          const snapshot = async (label) => {
            const data = await page.evaluate(() => {
              const visible = [...document.querySelectorAll('body *')]
                .filter(el => {
                  const s = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return s.visibility !== 'hidden' && s.display !== 'none' && r.width > 0 && r.height > 0;
                })
                .slice(0, 2500)
                .map(el => ({
                  tag: el.tagName,
                  id: el.id || null,
                  cls: typeof el.className === 'string' ? el.className : null,
                  role: el.getAttribute('role'),
                  aria: el.getAttribute('aria-label'),
                  title: el.getAttribute('title'),
                  text: (el.innerText || el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 300),
                  rect: (() => { const r = el.getBoundingClientRect(); return { x:r.x, y:r.y, w:r.width, h:r.height }; })(),
                }))
                .filter(x => x.text || x.aria || x.title || x.id);
              return {
                url: location.href,
                title: document.title,
                bodyText: document.body.innerText,
                html: document.documentElement.outerHTML,
                visible,
                localStorage: Object.fromEntries(Object.entries(localStorage)),
                sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
                canvases: [...document.querySelectorAll('canvas')].map((c,i)=>({i,width:c.width,height:c.height,rect:(()=>{const r=c.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()})),
                images: [...document.images].map((im,i)=>({i,src:im.currentSrc||im.src,alt:im.alt,width:im.naturalWidth,height:im.naturalHeight,rect:(()=>{const r=im.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()})),
              };
            });
            fs.writeFileSync(path.join(out, `${label}.json`), JSON.stringify({ ...data, html: undefined }, null, 2));
            fs.writeFileSync(path.join(out, `${label}.html`), data.html);
            await page.screenshot({ path: path.join(out, 'screens', `${label}.png`), fullPage: true });
          };

          await snapshot('state-00');

          // Turn pages conservatively. Try explicit reader turners, then keyboard.
          for (let i = 1; i <= 36; i++) {
            let acted = false;
            const selectors = [
              '#sitbreaderrightpageturner',
              '[data-testid*="right"]',
              '[aria-label*="Next"]',
              '[aria-label*="next"]',
              '.sitbreaderrightpageturner',
            ];
            for (const sel of selectors) {
              const loc = page.locator(sel).first();
              if (await loc.count()) {
                try { await loc.click({ timeout: 1200 }); acted = true; break; } catch {}
              }
            }
            if (!acted) await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(1200);
            if (i <= 8 || i % 4 === 0) await snapshot(`state-${String(i).padStart(2,'0')}`);
          }

          fs.writeFileSync(path.join(out, 'network.json'), JSON.stringify(network, null, 2));
          fs.writeFileSync(path.join(out, 'errors.json'), JSON.stringify(errors, null, 2));
          fs.writeFileSync(path.join(out, 'cookies.json'), JSON.stringify(await context.cookies(), null, 2));
          fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify({
            finalUrl: page.url(),
            networkCount: network.length,
            interestingResponses: network.filter(x => interesting(x.url)).length,
            savedResponseFiles: fs.readdirSync(path.join(out, 'responses')).length,
            errorCount: errors.length,
          }, null, 2));
          await browser.close();
          JS
          node /tmp/capture.mjs
          find public-media-analysis/reader-capture -type f -printf '%p\t%s bytes\n' | sort > public-media-analysis/reader-capture/FILE-INVENTORY.txt
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: genesis-reader-capture
          path: public-media-analysis/reader-capture
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Persist capture summary and run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/READER_CAPTURE_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/reader-capture/summary.json public-media-analysis/reader-capture/network.json public-media-analysis/reader-capture/errors.json public-media-analysis/READER_CAPTURE_RUN_ID.txt
          git commit -m "research: persist Genesis reader capture summary $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
