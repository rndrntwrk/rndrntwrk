name: Live RNDRNTWRK Paper origin probe

on:
  push:
    branches:
      - debug/live-paper-origin-20260916
    paths:
      - .github/workflows/live-paper-origin-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Distinguish Cloudflare cache from origin routing
        shell: bash
        run: |
          set -u -o pipefail

          stamp="$(date +%s)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          custom_host='rndrntwrk.com'
          custom="https://${custom_host}"
          railway="https://rndrweb-production.up.railway.app"
          railway_ip="$(dig +short rndrweb-production.up.railway.app A | head -n 1)"
          unique_path="/__rndr_origin_probe_${stamp}"

          fetch() {
            local label="$1"
            local url="$2"
            local output="$3"
            shift 3

            echo "FETCH $label $url"
            status="$(curl \
              --location \
              --compressed \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --dump-header "${output}.headers" \
              --output "$output" \
              --write-out '%{http_code}' \
              "$@" \
              "$url" || true)"

            echo "RESULT $label status=$status bytes=$(wc -c < "$output") sha256=$(sha256sum "$output" | awk '{print $1}')"
            echo "TITLE $label $(grep -Eio '<title>[^<]*</title>' "$output" | head -n 1 || true)"
            echo "MARKERS $label"
            grep -Eo 'Render Network - Hub|Render Network Protocol|paper-route-guard\.js\?v=[^"<]+|aria-label="(Docs|Paper)"|>Docs</a>|>Paper</a>' "$output" | head -n 20 || true
          }

          echo '=== DNS ==='
          echo "custom A: $(dig +short rndrntwrk.com A | tr '\n' ' ')"
          echo "custom AAAA: $(dig +short rndrntwrk.com AAAA | tr '\n' ' ')"
          echo "railway A: $(dig +short rndrweb-production.up.railway.app A | tr '\n' ' ')"
          echo "railway_ip=$railway_ip"

          fetch custom-root "${custom}/?origin_probe=${stamp}" "$work/custom-root.html"
          fetch custom-root-no-cache "${custom}/?origin_probe_no_cache=${stamp}" "$work/custom-root-no-cache.html" \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache'
          fetch custom-unique-path "${custom}${unique_path}" "$work/custom-unique-path.html"
          fetch railway-root "${railway}/?origin_probe=${stamp}" "$work/railway-root.html"
          fetch railway-unique-path "${railway}${unique_path}" "$work/railway-unique-path.html"
          fetch railway-custom-host "${custom}/?direct_railway=${stamp}" "$work/railway-custom-host.html" \
            --resolve "${custom_host}:443:${railway_ip}"
          fetch cloudflare-trace "${custom}/cdn-cgi/trace?origin_probe=${stamp}" "$work/cloudflare-trace.txt"

          echo '=== HEADERS ==='
          for headers in "$work"/*.headers; do
            echo "--- $(basename "$headers")"
            grep -Ei '^(HTTP/|age:|cache-control:|content-type:|etag:|last-modified:|server:|via:|cf-cache-status:|cf-ray:|x-railway|x-powered-by:|location:)' "$headers" || true
          done

          echo '=== CLOUDFLARE TRACE ==='
          cat "$work/cloudflare-trace.txt" || true

          echo '=== CLASSIFICATION ==='
          custom_unique_title="$(grep -Eio '<title>[^<]*</title>' "$work/custom-unique-path.html" | head -n 1 || true)"
          direct_railway_title="$(grep -Eio '<title>[^<]*</title>' "$work/railway-custom-host.html" | head -n 1 || true)"

          if grep -Fq 'Render Network Protocol' "$work/custom-unique-path.html"; then
            echo 'CLASSIFICATION cloudflare_origin_is_current_but_root_cache_is_stale'
          elif grep -Fq 'Render Network - Hub' "$work/custom-unique-path.html" || grep -Fq '__NEXT_DATA__' "$work/custom-unique-path.html"; then
            echo 'CLASSIFICATION cloudflare_origin_or_worker_still_routes_to_old_hub'
          else
            echo "CLASSIFICATION custom_unique_path_unknown title=$custom_unique_title"
          fi

          if grep -Fq 'Render Network Protocol' "$work/railway-custom-host.html"; then
            echo 'RAILWAY_CUSTOM_HOST_OK true'
          else
            echo "RAILWAY_CUSTOM_HOST_OK false title=$direct_railway_title"
          fi

          if cmp -s "$work/custom-root.html" "$work/railway-root.html"; then
            echo 'CUSTOM_ROOT_MATCHES_RAILWAY true'
          else
            echo 'CUSTOM_ROOT_MATCHES_RAILWAY false'
          fi

          if cmp -s "$work/custom-unique-path.html" "$work/railway-unique-path.html"; then
            echo 'CUSTOM_UNIQUE_PATH_MATCHES_RAILWAY true'
          else
            echo 'CUSTOM_UNIQUE_PATH_MATCHES_RAILWAY false'
          fi

          echo 'origin routing probe complete'
