name: Capture public sample search index

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/capture-public-search-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Fetch index metadata and referenced resources
        shell: bash
        run: |
          set -euo pipefail
          out=public-media-analysis/search-index
          rm -rf "$out" && mkdir -p "$out/resources"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          card='https://read.amazon.com/sample/B0FK7RBDFL?clientId=share&asin=B0FK7RBDFL&revisionId=64363d23&format=3&depth=1'
          curl -L --compressed -sS -A "$ua" -c "$out/cookies.txt" "$card" -o "$out/sample.html"
          url='https://read.amazon.com/service/web/content/getSearchIndex?asin=B0FK7RBDFL&contentVersion=64363d23&formatVersion=undefined&facet=YJ'
          curl -L --compressed -sS -A "$ua" -b "$out/cookies.txt" -c "$out/cookies.txt" -e "$card" -H 'Accept: application/json' -D "$out/index.headers" "$url" -o "$out/index.json"
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          out=Path('public-media-analysis/search-index')
          raw=(out/'index.json').read_text(errors='replace')
          try:
              obj=json.loads(raw)
          except Exception:
              obj={'raw':raw}
          (out/'index.pretty.json').write_text(json.dumps(obj,indent=2,ensure_ascii=False))
          urls=sorted(set(re.findall(r'https?://[^"\\\s]+',raw)))
          summary={'index_bytes':len(raw.encode()),'urls':urls,'downloads':[]}
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          for i,u in enumerate(urls):
              p=out/'resources'/f'resource-{i:02d}.bin'
              r=subprocess.run(['curl','-L','--compressed','-sS','-A',ua,u,'-o',str(p),'-w','%{http_code}\t%{content_type}'],capture_output=True,text=True)
              summary['downloads'].append({'url':u,'status':r.stdout.strip(),'bytes':p.stat().st_size if p.exists() else 0,'file':str(p)})
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print((out/'index.pretty.json').read_text()[:5000])
          print((out/'summary.json').read_text())
          PY

      - name: Upload captured search index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-sample-search-index
          path: public-media-analysis/search-index
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Persist compact index evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/search-index/index.json public-media-analysis/search-index/index.pretty.json public-media-analysis/search-index/summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist public sample search index $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
