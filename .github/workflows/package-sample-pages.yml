name: Package first Hunting Time sample pages

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/package-sample-pages.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: hunting-time-first-sample-pages
          path: public-media-analysis/sample-pages
          if-no-files-found: error
          retention-days: 1
      - name: Record artifact coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('public-media-analysis/sample-pages-package-run.json').write_text(json.dumps({
            'run_id': int(os.environ['RUN_ID']),
            'artifact_id': int(os.environ['ARTIFACT_ID']),
            'artifact_url': os.environ.get('ARTIFACT_URL',''),
          }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/sample-pages-package-run.json
          git commit -m 'research: record first sample-pages artifact'
          git push origin HEAD:research/public-media-analysis
