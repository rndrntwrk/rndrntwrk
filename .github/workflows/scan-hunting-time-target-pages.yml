name: Scan Hunting Time target paperback pages

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/scan-hunting-time-target-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Query public paperback search index
        run: |
          cat > /tmp/scan_pages.py <<'PY'
          from __future__ import annotations
          import json
          import math
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ASIN = 'B0FRGB2PMR'
          ENDPOINT = 'https://read.amazon.com/sample/print/search-results'
          TARGET_LABELS = {'Page 14','Page 19','Page 21','Page 24','Page 32','Page 103','Page 110','Page 241'}
          PAGE_SIZE = 100
          root = Path('public-media-analysis')
          words = (root / 'wordlists' / 'bip39-english.txt').read_text().split()
          outdir = root / 'target-page-bip39-scan'
          outdir.mkdir(parents=True, exist_ok=True)

          def request(term: str, page_number: int):
              params = {
                  'asin': ASIN,
                  'buyingAsin': ASIN,
                  'query': term,
                  'pageNumber': page_number,
                  'pageSize': PAGE_SIZE,
              }
              url = ENDPOINT + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              })
              last = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read()), url
                  except Exception as exc:
                      last = exc
                      time.sleep(min(8.0, 0.7 * (2 ** attempt)) + random.random() * 0.2)
              raise RuntimeError(f'{term=} {page_number=}: {last!r}')

          page_words = {label: [] for label in sorted(TARGET_LABELS)}
          word_hits = {}
          errors = []
          stats = {'words': len(words), 'requests': 0, 'pages_fetched': 0}

          for wi, term in enumerate(words, 1):
              try:
                  body, url = request(term, 1)
                  stats['requests'] += 1
                  total = int(body.get('totalResults') or 0)
                  rows = list(body.get('results') or [])
                  pages = max(1, math.ceil(total / PAGE_SIZE)) if total else 1
                  # The service caps page size at 100. Fetch all result pages so common
                  # words cannot hide a late target such as Page 241.
                  for pn in range(2, pages + 1):
                      body2, _ = request(term, pn)
                      stats['requests'] += 1
                      rows.extend(body2.get('results') or [])
                      time.sleep(0.025)
                  labels = sorted({str(r[1]) for r in rows if len(r) >= 2 and str(r[1]) in TARGET_LABELS})
                  if labels:
                      word_hits[term] = {'pages': labels, 'total_results': total}
                      for label in labels:
                          page_words[label].append(term)
                  stats['pages_fetched'] += pages
                  if wi % 100 == 0:
                      print(f'{wi}/{len(words)} words; requests={stats["requests"]}; hits={len(word_hits)}', flush=True)
                  time.sleep(0.04)
              except Exception as exc:
                  errors.append({'word': term, 'error': repr(exc)})
                  print('ERROR', term, repr(exc), flush=True)

          for label in page_words:
              page_words[label] = sorted(set(page_words[label]))

          payload = {
              'asin': ASIN,
              'target_pages': page_words,
              'word_hits': word_hits,
              'errors': errors,
              'stats': stats,
          }
          (outdir / 'results.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False))
          lines = ['# Hunting Time target-page BIP39 membership', '']
          for label, found in page_words.items():
              lines += [f'## {label}', '', f'Count: {len(found)}', '', ', '.join(f'`{w}`' for w in found), '']
          lines += ['## Scan statistics', '', '```json', json.dumps(stats, indent=2), '```', '', f'Errors: {len(errors)}', '']
          (outdir / 'results.md').write_text('\n'.join(lines))
          print(json.dumps({'stats': stats, 'errors': len(errors), 'counts': {k: len(v) for k,v in page_words.items()}}, indent=2))
          PY
          python /tmp/scan_pages.py | tee /tmp/scan-pages-console.txt

      - name: Persist scan outputs and run id
        if: always()
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/TARGET_PAGE_BIP39_RUN_ID.txt
          cp /tmp/scan-pages-console.txt public-media-analysis/target-page-bip39-scan/console.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/target-page-bip39-scan public-media-analysis/TARGET_PAGE_BIP39_RUN_ID.txt
          git commit -m 'research: add target-page BIP39 membership scan' || exit 0
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
