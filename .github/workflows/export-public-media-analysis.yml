name: Export public media analysis bundle

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/export-public-media-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
          fetch-depth: 0
      - name: Inventory bundle and record run
        run: |
          find public-media-analysis -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort | tee public-media-analysis/INVENTORY.txt
          cat > public-media-analysis/EXPORT_RUN.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "workflow_sha": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}"
          }
          EOF
      - name: Persist run metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/INVENTORY.txt public-media-analysis/EXPORT_RUN.json
          git commit -m 'research: record public media export run' || true
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
      - name: Upload recovered public evidence
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-public-media-analysis
          path: public-media-analysis
          if-no-files-found: error
          retention-days: 7
