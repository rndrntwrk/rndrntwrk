name: Probe targeted contexts beyond public sample boundary

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/probe-context-beyond-sample.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - run: python -m pip install --disable-pip-version-check -q requests cryptography
      - name: Probe sparse positions
        shell: bash
        run: |
          set -euo pipefail
          out=public-media-analysis/context-beyond-sample
          rm -rf "$out"; mkdir -p "$out"
          cat > /tmp/probe.py <<'PY'
          import base64,json,time
          from pathlib import Path
          import requests
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          out=Path('public-media-analysis/context-beyond-sample')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/json','Referer':'https://read.amazon.com/sample/B0FK7RBDFL?clientId=share','Origin':'https://read.amazon.com'})
          s.get('https://read.amazon.com/sample/B0FK7RBDFL?clientId=share',timeout=30)
          endpoint='https://read.amazon.com/service/web/content/getSearchContext'
          ident='CR!CHPJ159K3X04FAFE0X117MS13EMN'; rev='64363d23'
          positions=[49799,49800,50000,52000,55000,60000,70000,80000,90000,100000,120000,140000,150000,160000,170000,180000,200000,220000,240000,260000,280000,300000,320000,340000,360000,370000,380000,400000,420000,440000,460000]
          def dec(x):
            k=base64.b64decode(x[:24]); iv=base64.b64decode(x[24:48]); ct=base64.b64decode(x[48:]); return AESGCM(k).decrypt(iv,ct,None).decode('utf-8')
          rows=[]
          for i in range(0,len(positions),20):
            batch=positions[i:i+20]
            payload={'asin':'B0FK7RBDFL','positions':[[p] for p in batch],'refEmId':ident,'revision':rev,'yjACR':ident,'clientVersion':'20000100'}
            r=s.post(endpoint,json=payload,timeout=60)
            rec={'batch':batch,'status':r.status_code,'bytes':len(r.content),'contexts':[],'raw_prefix':r.text[:300]}
            if r.status_code==200:
              obj=r.json(); rec['count']=len(obj.get('searchContexts',[]))
              for p,c in zip(batch,obj.get('searchContexts',[])):
                try: rec['contexts'].append({'position':p,'text':dec(c)})
                except Exception as e: rec['contexts'].append({'position':p,'error':repr(e)})
            rows.append(rec); print(json.dumps(rec,ensure_ascii=False),flush=True); time.sleep(.3)
          (out/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
          python /tmp/probe.py
      - name: Persist compact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/context-beyond-sample || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist beyond-sample context probe $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
