name: Exercise public Kindle sample control

on:
  push:
    branches:
      - research/kindle-preview-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  click:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kindle-preview-analysis
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - name: Click the public Read sample control and capture resulting traffic
        run: |
          set -euo pipefail
          out=public-media-analysis/kindle-preview/click-sample
          mkdir -p "$out"
          cat > /tmp/click_sample.py <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path('public-media-analysis/kindle-preview/click-sample')
          URL='https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'

          async def main():
              requests=[]; responses=[]; consoles=[]; errors=[]; popups=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(viewport={'width':1440,'height':1200})
                  page=await context.new_page()
                  page.on('request', lambda r: requests.append({'method':r.method,'url':r.url,'resource_type':r.resource_type}))
                  page.on('response', lambda r: responses.append({'status':r.status,'url':r.url,'content_type':r.headers.get('content-type','')}))
                  page.on('console', lambda m: consoles.append({'type':m.type,'text':m.text}))
                  page.on('pageerror', lambda e: errors.append(str(e)))
                  context.on('page', lambda pg: popups.append(pg))

                  await page.goto(URL, wait_until='networkidle', timeout=120000)
                  await page.screenshot(path=str(OUT/'before.png'), full_page=True)
                  (OUT/'before.html').write_text(await page.content())
                  (OUT/'before.txt').write_text((await page.locator('body').inner_text())+'\n')

                  candidates=page.get_by_text('Read sample', exact=True)
                  count=await candidates.count()
                  result={'initial_url':page.url,'candidate_count':count}
                  if count:
                      target=candidates.first
                      result['tag']=await target.evaluate('(e)=>e.tagName')
                      result['outer_html']=await target.evaluate('(e)=>e.outerHTML')
                      try:
                          async with page.expect_popup(timeout=10000) as pinfo:
                              await target.click(timeout=30000)
                          popup=await pinfo.value
                          await popup.wait_for_load_state('networkidle', timeout=120000)
                          page=popup
                          result['opened_popup']=True
                      except Exception as exc:
                          result['popup_exception']=repr(exc)
                          try:
                              await target.click(timeout=30000)
                          except Exception as exc2:
                              result['second_click_exception']=repr(exc2)
                      try:
                          await page.wait_for_load_state('networkidle', timeout=120000)
                      except Exception as exc:
                          result['post_wait_exception']=repr(exc)
                      await page.wait_for_timeout(10000)
                  else:
                      # Search through open shadow roots and click an element whose rendered text matches.
                      clicked=await page.evaluate('''() => {
                        const seen=[];
                        function walk(root){
                          for(const el of root.querySelectorAll('*')){
                            if(el.shadowRoot) walk(el.shadowRoot);
                            const text=(el.innerText||el.textContent||'').trim();
                            if(text==='Read sample'){
                              seen.push({tag:el.tagName, html:el.outerHTML});
                              el.click();
                              return true;
                            }
                          }
                          return false;
                        }
                        return {clicked:walk(document), seen};
                      }''')
                      result['shadow_search']=clicked
                      await page.wait_for_timeout(15000)

                  result['final_url']=page.url
                  result['pages']=[pg.url for pg in context.pages]
                  await page.screenshot(path=str(OUT/'after.png'), full_page=True)
                  (OUT/'after.html').write_text(await page.content())
                  try: (OUT/'after.txt').write_text((await page.locator('body').inner_text())+'\n')
                  except Exception as exc: result['after_text_exception']=repr(exc)
                  (OUT/'result.json').write_text(json.dumps(result,indent=2))
                  (OUT/'requests.json').write_text(json.dumps(requests,indent=2))
                  (OUT/'responses.json').write_text(json.dumps(responses,indent=2))
                  (OUT/'console.json').write_text(json.dumps(consoles,indent=2))
                  (OUT/'errors.json').write_text(json.dumps(errors,indent=2))
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/click_sample.py
          cat "$out/result.json"
          cat "$out/after.txt" || true
      - name: Persist text diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/kindle-preview/click-sample/*.html \
                  public-media-analysis/kindle-preview/click-sample/*.txt \
                  public-media-analysis/kindle-preview/click-sample/*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist public Kindle sample click diagnostics'
          git push origin HEAD:research/kindle-preview-analysis
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: public-kindle-sample-click-screenshots
          path: public-media-analysis/kindle-preview/click-sample/*.png
          retention-days: 7
