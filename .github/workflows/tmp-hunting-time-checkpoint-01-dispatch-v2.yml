name: Temporary Hunting Time checkpoint 01 dispatcher v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-hunting-time-checkpoint-01-dispatch-v2.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
          fetch-depth: 1

      - name: Persist run identity to the research branch
        shell: bash
        run: |
          set -euo pipefail
          out=research/hunting-time/checkpoint-01-output
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/ACTIVE_RUN_ID.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/DISPATCH_SHA.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out/ACTIVE_RUN_ID.txt" "$out/DISPATCH_SHA.txt"
          git commit -m "research: mark Hunting Time checkpoint 01 retry ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin research/public-media-analysis && git push origin HEAD:research/public-media-analysis; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal oracle dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check -q 'cryptography>=42,<46'

      - name: Correct the source assertion and preserve executed runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('research/hunting-time/checkpoint-01/run_checkpoint01.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          output = []
          i = 0
          replaced = False
          while i < len(lines):
              if '"segwit_derivation_prefix_m_0_hardened"' in lines[i]:
                  output.append("        \"segwit_derivation_prefix_m_0_hardened\": \"m/0'/\" in sources[\"keystore.py\"],")
                  i += 3
                  replaced = True
              else:
                  output.append(lines[i])
                  i += 1
          if not replaced:
              raise SystemExit('source assertion block not found')
          p.write_text('\n'.join(output) + '\n', encoding='utf-8')
          out = Path('research/hunting-time/checkpoint-01-output')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'executed-runner.py').write_bytes(p.read_bytes())
          PY
          python -m py_compile research/hunting-time/checkpoint-01/run_checkpoint01.py

      - name: Execute checkpoint 01 only
        shell: bash
        run: |
          set -euo pipefail
          python research/hunting-time/checkpoint-01/run_checkpoint01.py \
            --root "$GITHUB_WORKSPACE" \
            --output research/hunting-time/checkpoint-01-output \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-sha "$GITHUB_SHA"

      - name: Persist completed checkpoint to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/hunting-time/checkpoint-01-output
          git commit -m "research: complete Hunting Time checkpoint 01 run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin research/public-media-analysis && git push origin HEAD:research/public-media-analysis; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-checkpoint-01-complete
          path: research/hunting-time/checkpoint-01-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
