name: Probe Hunting Time first pages

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/probe-hunting-time-page14.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Probe page 1 and persist public preview response
        run: |
          set -euxo pipefail
          out=public-media-analysis/page1-probe
          rm -rf "$out"
          mkdir -p "$out"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card='https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'
          base='https://read.amazon.com/sample/print'
          curl -L --compressed --retry 3 -sS -A "$ua" -c "$out/cookies.txt" -D "$out/card.headers" "$card" -o "$out/card.html"
          curl -L --compressed --retry 3 -sS -A "$ua" -b "$out/cookies.txt" -c "$out/cookies.txt" -e "$card" -D "$out/book-data.headers" "$base/book-data?asin=B0FK7RBDFL" -o "$out/book-data.json"
          query='asin=B0FK7RBDFL&buyingAsin=B0FK7RBDFL&page=1&token=null'
          curl -L --compressed --retry 3 -sS -A "$ua" -b "$out/cookies.txt" -c "$out/cookies.txt" -e "$card" \
            -H 'Accept: application/json' -D "$out/go.headers" "$base/go-to-page?$query" -o "$out/go.body"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path('public-media-analysis/page1-probe')
          obj=json.loads((out/'go.body').read_text())
          (out/'go.pretty.json').write_text(json.dumps(obj,indent=2,ensure_ascii=False))
          urls=obj.get('jumboImageUrls') or obj.get('largeImageUrls') or {}
          if not isinstance(urls,dict): raise SystemExit('missing page URL dictionary')
          for key,url in urls.items():
              n=int(key)
              if n>13: continue
              dst=out/f'page-{n:03d}.jpg'
              subprocess.run(['curl','-L','--compressed','--retry','3','-sS',url,'-o',str(dst)],check=True)
          missing=[n for n in range(1,14) if not (out/f'page-{n:03d}.jpg').exists()]
          if missing: raise SystemExit(f'missing {missing}')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          for img in "$out"/page-*.jpg; do tesseract "$img" "${img%.jpg}" --psm 6 >/dev/null 2>&1 || true; done
          find "$out" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > "$out/FILE_INDEX.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'research: persist first public preview pages'
          git push origin HEAD:research/public-media-analysis
