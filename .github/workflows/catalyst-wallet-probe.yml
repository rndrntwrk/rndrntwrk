name: Catalyst GMGN candidate wallet probe

on:
  push:
    branches:
      - forensics/catalyst-api-bridge-20260826
    paths:
      - .github/workflows/catalyst-wallet-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install indexed-feed client
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Fetch raw 7d and 30d wallet profiles
        run: python forensics/catalyst/wallet_probe.py

      - name: Commit wallet evidence to the isolated branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics/catalyst/output/gmgn_candidate_wallet_raw.json \
                  forensics/catalyst/output/gmgn_candidate_wallet_raw_flat.csv \
                  forensics/catalyst/output/gmgn_candidate_wallet_schema.json
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
            exit 0
          fi
          git commit -m 'Record raw candidate wallet profiles'
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload wallet profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-candidate-wallet-profiles
          path: |
            forensics/catalyst/output/gmgn_candidate_wallet_raw.json
            forensics/catalyst/output/gmgn_candidate_wallet_raw_flat.csv
            forensics/catalyst/output/gmgn_candidate_wallet_schema.json
          if-no-files-found: warn
          retention-days: 7
