name: Temporary RNDRNTWRK asset-origin probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rndrntwrk-live-load-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'debug/rndrntwrk-load-2026-08-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact critical files on every plausible origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/bodies evidence/headers
          urls=(
            'https://assets.rendernet.work/assets/shaders/compiled.vs'
            'https://assets.rendernet.work/assets/js/modules.1746999829739.js'
            'https://assets.rndrntwrk.com/assets/shaders/compiled.vs'
            'https://assets.rndrntwrk.com/assets/js/modules.1746999829739.js'
            'https://www.rndrntwrk.com/assets/shaders/compiled.vs'
            'https://www.rndrntwrk.com/assets/js/modules.1746999829739.js'
          )

          : > evidence/results.tsv
          printf 'url\tcurl_exit\thttp_code\tremote_ip\tcontent_type\tsize\tsha256\n' >> evidence/results.tsv
          for url in "${urls[@]}"; do
            key="$(printf '%s' "$url" | sha256sum | cut -c1-16)"
            body="evidence/bodies/${key}.bin"
            : > "$body"
            set +e
            meta="$(curl --location --silent --show-error \
              --connect-timeout 8 --max-time 25 \
              --dump-header "evidence/headers/${key}.txt" \
              --output "$body" \
              --write-out $'%{http_code}\t%{remote_ip}\t%{content_type}' \
              "$url" 2>"evidence/${key}.stderr")"
            rc=$?
            set -e
            size="$(wc -c < "$body")"
            sha="$(sha256sum "$body" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\t%s\n' "$url" "$rc" "$meta" "$size" "$sha" >> evidence/results.tsv
            printf 'curl_exit=%s url=%s\n' "$rc" "$url" >> "evidence/${key}.stderr"
          done

          cat evidence/results.tsv
          echo '=== STDERR ==='
          cat evidence/*.stderr

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rndrntwrk-asset-origin-probe
          path: evidence
          retention-days: 3
