name: Temporary RNDRNTWRK supported-path trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rndrntwrk-live-load-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'debug/rndrntwrk-load-2026-08-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trace production while bypassing only the unsupported-browser redirect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          google-chrome --version | tee evidence/chrome-version.txt
          npm --silent --no-audit --no-fund install playwright-core@1.55.0

          cat > trace-supported.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright-core');

          const target = 'https://www.rndrntwrk.com/';
          const appPattern = /assets\/js\/app\.1746999829739\.js(?:\?.*)?$/;
          const root = path.resolve('evidence');

          async function trace(browser, name, contextOptions = {}) {
            const dir = path.join(root, name);
            fs.mkdirSync(dir, { recursive: true });
            const data = {
              console: [], pageErrors: [], requestFailures: [], responses: [], timeline: [],
              patch: null, navigationError: null, networkIdleError: null,
            };

            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              serviceWorkers: 'block',
              recordHar: { path: path.join(dir, 'network.har'), content: 'embed', mode: 'full' },
              ...contextOptions,
            });
            const page = await context.newPage();

            await page.addInitScript(() => {
              window._PERF_DEBUG = true;
              window.addEventListener('loader:suppressed-error', event => {
                console.error('[SUPPRESSED-BY-LOADER]', JSON.stringify(event.detail));
              });
            });

            await page.route('**/assets/js/app.1746999829739.js*', async route => {
              const response = await route.fetch();
              let body = await response.text();
              const before = body;
              body = body.replace(
                /\(\(UnsupportedRedirect\.requiresWebGL\s*=\s*!0\),\s*UnsupportedRedirect\.unsupported\(\)\)/,
                '((UnsupportedRedirect.requiresWebGL = !1), false)'
              );
              data.patch = {
                url: route.request().url(),
                matched: body !== before,
                originalBytes: Buffer.byteLength(before),
                patchedBytes: Buffer.byteLength(body),
              };
              await route.fulfill({ response, body, headers: { ...response.headers(), 'cache-control': 'no-store' } });
            });

            page.on('console', message => data.console.push({
              type: message.type(), text: message.text(), location: message.location(), at: Date.now(),
            }));
            page.on('pageerror', error => data.pageErrors.push({
              name: error.name, message: error.message, stack: error.stack, at: Date.now(),
            }));
            page.on('requestfailed', request => data.requestFailures.push({
              url: request.url(), method: request.method(), resourceType: request.resourceType(),
              failure: request.failure(), at: Date.now(),
            }));
            page.on('response', response => {
              const request = response.request();
              const headers = response.headers();
              data.responses.push({
                url: response.url(), status: response.status(), method: request.method(),
                resourceType: request.resourceType(), contentType: headers['content-type'] || '',
                contentLength: headers['content-length'] || '', at: Date.now(),
              });
            });

            try {
              await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45000 });
            } catch (error) {
              data.navigationError = { message: error.message, stack: error.stack };
            }
            try {
              await page.waitForLoadState('networkidle', { timeout: 15000 });
            } catch (error) {
              data.networkIdleError = { message: error.message };
            }

            for (let second = 0; second <= 45; second++) {
              const snapshot = await page.evaluate(s => {
                const load = document.querySelector('#load-progress');
                const status = document.querySelector('#load-status');
                const stage = document.querySelector('#Stage');
                const canvases = [...document.querySelectorAll('canvas')];
                let loadFinishedState = null;
                try {
                  if (window.AppState && typeof window.AppState.get === 'function') {
                    loadFinishedState = window.AppState.get('Global/loadFinished');
                  }
                } catch (error) {
                  loadFinishedState = `get-error:${error.message}`;
                }
                return {
                  second: s,
                  href: location.href,
                  readyState: document.readyState,
                  bodyClass: document.body?.className || '',
                  bodyText: (document.body?.innerText || '').slice(0, 1200),
                  loadStatus: status?.textContent || null,
                  loadDisplay: load ? getComputedStyle(load).display : null,
                  loadOpacity: load ? getComputedStyle(load).opacity : null,
                  stageExists: Boolean(stage),
                  stageChildren: stage?.children?.length || 0,
                  canvases: canvases.length,
                  visibleCanvases: canvases.filter(c => {
                    const style = getComputedStyle(c);
                    return style.display !== 'none' && style.visibility !== 'hidden' && c.width > 0 && c.height > 0;
                  }).length,
                  threeDLoaded: window._3dLoaded,
                  mainType: typeof window.Main,
                  mainStaticInitType: typeof window.Main?.init,
                  hydraMainExists: Boolean(window.Hydra?.Main),
                  qualityManager: window.QualityManager ? {
                    initialized: window.QualityManager.initialized,
                    tier: window.QualityManager.currentTier,
                  } : null,
                  gpu: typeof window.GPU === 'undefined' ? null : {
                    initialized: window.GPU.initialized,
                    blocklist: window.GPU.BLOCKLIST,
                  },
                  deviceWebGL: window.Device?.graphics?.webgl ?? null,
                  appStateExists: Boolean(window.AppState),
                  loadFinishedState,
                  suppressedErrors: window._loaderSuppressedErrors ? JSON.parse(JSON.stringify(window._loaderSuppressedErrors)) : null,
                  perfLog: window._perfLog ? JSON.parse(JSON.stringify(window._perfLog)) : null,
                };
              }).catch(error => ({ second, evaluationError: String(error) }));
              data.timeline.push(snapshot);
              console.log('TIMELINE', JSON.stringify(snapshot));
              if (second < 45) await page.waitForTimeout(1000);
            }

            const finalState = await page.evaluate(() => ({
              href: location.href,
              title: document.title,
              bodyClass: document.body?.className || '',
              bodyText: document.body?.innerText || '',
              threeDLoaded: window._3dLoaded,
              suppressedErrors: window._loaderSuppressedErrors || null,
              perfLog: window._perfLog || null,
              resources: performance.getEntriesByType('resource').map(resource => ({
                name: resource.name,
                initiatorType: resource.initiatorType,
                duration: resource.duration,
                transferSize: resource.transferSize,
                decodedBodySize: resource.decodedBodySize,
              })),
            })).catch(error => ({ evaluationError: String(error) }));

            await page.screenshot({ path: path.join(dir, 'screenshot.png'), fullPage: true });
            fs.writeFileSync(path.join(dir, 'rendered.html'), await page.content());
            fs.writeFileSync(path.join(dir, 'events.json'), JSON.stringify(data, null, 2));
            fs.writeFileSync(path.join(dir, 'state.json'), JSON.stringify(finalState, null, 2));

            const summary = {
              name,
              patch: data.patch,
              pageErrors: data.pageErrors,
              consoleProblems: data.console.filter(entry => ['error', 'warning', 'warn'].includes(entry.type)),
              requestFailures: data.requestFailures,
              badResponses: data.responses.filter(entry => entry.status >= 400),
              timeline: data.timeline,
              finalState,
            };
            fs.writeFileSync(path.join(dir, 'summary.json'), JSON.stringify(summary, null, 2));
            console.log('TRACE_SUMMARY_BEGIN', name);
            console.log(JSON.stringify(summary, null, 2));
            console.log('TRACE_SUMMARY_END', name);
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--enable-unsafe-swiftshader',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--ignore-gpu-blocklist',
              ],
            });
            try {
              await trace(browser, 'desktop-supported');
              await trace(browser, 'mobile-supported', {
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
              });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          node trace-supported.cjs 2>&1 | tee evidence/browser.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rndrntwrk-supported-path-evidence
          path: evidence
          retention-days: 3
