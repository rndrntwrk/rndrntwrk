name: Temporary RNDRNTWRK live-load trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rndrntwrk-live-load-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'debug/rndrntwrk-load-2026-08-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture HTTP source and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/bundles
          curl --fail-with-body --silent --show-error --location --compressed \
            --dump-header evidence/headers.txt \
            --output evidence/index.html \
            https://rndrntwrk.com/

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import json, subprocess

          base = 'https://www.rndrntwrk.com/'
          html = Path('evidence/index.html').read_text(errors='replace')
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.assets=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('src','href'):
                      if key in d:
                          self.assets.append({'tag':tag,'attr':key,'url':urljoin(base,d[key])})
          p=Parser(); p.feed(html)
          Path('evidence/html-assets.json').write_text(json.dumps(p.assets,indent=2))
          for asset in p.assets:
              url=asset['url']
              if asset['tag']=='script' and urlparse(url).hostname=='www.rndrntwrk.com':
                  name=urlparse(url).path.strip('/').replace('/','_') or 'index.js'
                  subprocess.run(['curl','--fail-with-body','--silent','--show-error','--location','--compressed',
                                  '--dump-header',f'evidence/bundles/{name}.headers',
                                  '--output',f'evidence/bundles/{name}',url],check=False)
          PY

          google-chrome --version | tee evidence/chrome-version.txt
          npm --silent --no-audit --no-fund install playwright-core@1.55.0

          cat > trace.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { chromium } = require('playwright-core');

          const target = 'https://www.rndrntwrk.com/';
          const root = path.resolve('evidence');
          const bundleDir = path.join(root, 'bundles');
          fs.mkdirSync(bundleDir, { recursive: true });

          function filename(url) {
            const u = new URL(url);
            const ext = path.extname(u.pathname) || '.bin';
            const stem = `${u.hostname}${u.pathname}`.replace(/[^a-z0-9._-]/gi, '_').slice(0, 170);
            return `${stem}-${crypto.createHash('sha256').update(url).digest('hex').slice(0, 12)}${ext}`;
          }

          async function trace(browser, name, options = {}) {
            const dir = path.join(root, name);
            fs.mkdirSync(dir, { recursive: true });
            const data = {
              console: [], pageErrors: [], requestFailures: [], responses: [],
              webSockets: [], timeline: [], navigationError: null, networkIdleError: null,
            };
            const captures = [];
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              recordHar: { path: path.join(dir, 'network.har'), content: 'embed', mode: 'full' },
              ...options,
            });
            const page = await context.newPage();

            page.on('console', m => data.console.push({ type: m.type(), text: m.text(), location: m.location() }));
            page.on('pageerror', e => data.pageErrors.push({ name: e.name, message: e.message, stack: e.stack }));
            page.on('requestfailed', r => data.requestFailures.push({
              url: r.url(), method: r.method(), resourceType: r.resourceType(), failure: r.failure(),
            }));
            page.on('websocket', ws => {
              const item = { url: ws.url(), sent: 0, received: 0, errors: [], closed: false };
              data.webSockets.push(item);
              ws.on('framesent', () => item.sent++);
              ws.on('framereceived', () => item.received++);
              ws.on('socketerror', error => item.errors.push(String(error)));
              ws.on('close', () => { item.closed = true; });
            });
            page.on('response', response => {
              const request = response.request();
              const headers = response.headers();
              const row = {
                url: response.url(), status: response.status(), statusText: response.statusText(),
                resourceType: request.resourceType(), method: request.method(),
                contentType: headers['content-type'] || '',
                cache: headers['x-vercel-cache'] || headers['cf-cache-status'] || '',
              };
              data.responses.push(row);
              const isScript = request.resourceType() === 'script' || /javascript|ecmascript/.test(row.contentType);
              if (isScript && row.url.startsWith(target)) {
                captures.push((async () => {
                  try {
                    const body = await response.body();
                    if (body.length < 25 * 1024 * 1024) {
                      fs.writeFileSync(path.join(bundleDir, filename(row.url)), body);
                    }
                  } catch (error) {
                    data.console.push({ type: 'diagnostic', text: `bundle capture failed ${row.url}: ${error}` });
                  }
                })());
              }
            });

            try { await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45000 }); }
            catch (error) { data.navigationError = { message: error.message, stack: error.stack }; }
            try { await page.waitForLoadState('networkidle', { timeout: 15000 }); }
            catch (error) { data.networkIdleError = { message: error.message }; }

            for (let second = 0; second <= 15; second++) {
              data.timeline.push(await page.evaluate(s => {
                const main = document.querySelector('main');
                const stage = document.querySelector('#Stage');
                const load = document.querySelector('#load-progress');
                const status = document.querySelector('#load-status');
                return {
                  second: s,
                  href: location.href,
                  readyState: document.readyState,
                  bodyClass: document.body?.className || '',
                  bodyText: (document.body?.innerText || '').slice(0, 1600),
                  mainHtmlLength: main?.innerHTML?.length || 0,
                  stageExists: Boolean(stage),
                  stageHtmlLength: stage?.innerHTML?.length || 0,
                  loadStatus: status?.textContent || null,
                  loadDisplay: load ? getComputedStyle(load).display : null,
                  loadOpacity: load ? getComputedStyle(load).opacity : null,
                };
              }, second));
              if (second < 15) await page.waitForTimeout(1000);
            }

            const state = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              readyState: document.readyState,
              userAgent: navigator.userAgent,
              serviceWorkerControlled: Boolean(navigator.serviceWorker?.controller),
              localStorage: Object.fromEntries(Object.entries(localStorage)),
              sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
              bodyClass: document.body?.className || '',
              bodyText: document.body?.innerText || '',
              htmlLength: document.documentElement.outerHTML.length,
              scripts: [...document.scripts].map(s => ({ src: s.src, type: s.type, async: s.async, defer: s.defer })),
              stylesheets: [...document.styleSheets].map(s => s.href).filter(Boolean),
              resources: performance.getEntriesByType('resource').map(r => ({
                name: r.name, initiatorType: r.initiatorType, duration: r.duration,
                transferSize: r.transferSize, decodedBodySize: r.decodedBodySize,
              })),
            }));

            await page.screenshot({ path: path.join(dir, 'screenshot.png'), fullPage: true });
            fs.writeFileSync(path.join(dir, 'rendered.html'), await page.content());
            await Promise.allSettled(captures);
            fs.writeFileSync(path.join(dir, 'events.json'), JSON.stringify(data, null, 2));
            fs.writeFileSync(path.join(dir, 'state.json'), JSON.stringify(state, null, 2));

            const summary = {
              name,
              pageErrors: data.pageErrors,
              consoleProblems: data.console.filter(x => ['error','warning','warn'].includes(x.type)),
              requestFailures: data.requestFailures,
              badResponses: data.responses.filter(x => x.status >= 400),
              webSockets: data.webSockets,
              timeline: data.timeline,
              state,
            };
            fs.writeFileSync(path.join(dir, 'summary.json'), JSON.stringify(summary, null, 2));
            console.log(`TRACE_SUMMARY_BEGIN ${name}`);
            console.log(JSON.stringify(summary, null, 2));
            console.log(`TRACE_SUMMARY_END ${name}`);
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              await trace(browser, 'desktop-normal');
              await trace(browser, 'desktop-service-workers-blocked', { serviceWorkers: 'block' });
              await trace(browser, 'mobile-normal', {
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2, isMobile: true, hasTouch: true,
              });
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

          node trace.cjs 2>&1 | tee evidence/browser.log

      - name: Print source assets and bundle signatures
        if: always()
        shell: bash
        run: |
          echo '=== HTML assets ==='
          cat evidence/html-assets.json || true
          echo '=== bundle signatures ==='
          grep -RInE --binary-files=text \
            'ReferenceError|TypeError|Cannot access|initializ|WebGL|three|spline|throw new Error|Promise\.all|load-status' \
            evidence/bundles | head -n 600 || true
          echo '=== evidence files ==='
          find evidence -type f -printf '%p %s bytes\n' | sort

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rndrntwrk-live-load-evidence
          path: evidence
          retention-days: 3
