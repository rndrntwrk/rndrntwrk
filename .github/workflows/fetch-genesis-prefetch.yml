name: Fetch fresh Genesis sample prefetch resources

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/fetch-genesis-prefetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch fresh sample config and prefetch resources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fetch-prefetch.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import crypto from 'node:crypto';
          const out='public-media-analysis/sample-prefetch';
          fs.rmSync(out,{recursive:true,force:true}); fs.mkdirSync(out,{recursive:true});
          const ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36';
          const pageUrl='https://read.amazon.com/sample/B0FK7RBDFL?clientId=share';
          const resp=await fetch(pageUrl,{headers:{'user-agent':ua}});
          const html=await resp.text();
          fs.writeFileSync(path.join(out,'sample.html'),html);
          const m=html.match(/window\.envConfig\s*=\s*JSON\.parse\(("(?:\\.|[^"\\])*")\)\s*;/s);
          if(!m) throw new Error('envConfig literal not found');
          const decoded=vm.runInNewContext(m[1]);
          const cfg=JSON.parse(decoded);
          fs.writeFileSync(path.join(out,'env-config.json'),JSON.stringify(cfg,null,2));
          const pref=JSON.parse(cfg.karamelCdnPrefetchInfo);
          fs.writeFileSync(path.join(out,'prefetch.json'),JSON.stringify(pref,null,2));
          const rows=[];
          for(let i=0;i<pref.resources.length;i++){
            const r=pref.resources[i];
            const url=`${pref.cdn.baseUrl.replace(/\/$/,'')}/${r.url}?${r.authParameter}`;
            const rr=await fetch(url,{headers:{'user-agent':ua}});
            const body=Buffer.from(await rr.arrayBuffer());
            const ct=rr.headers.get('content-type')||'';
            let ext='.bin'; if(ct.includes('png'))ext='.png'; else if(ct.includes('jpeg'))ext='.jpg'; else if(ct.includes('json'))ext='.json'; else if(ct.includes('html'))ext='.html';
            const name=`resource-${String(i+1).padStart(2,'0')}${ext}`;
            fs.writeFileSync(path.join(out,name),body);
            rows.push({index:i+1,url:r.url,type:r.type,status:rr.status,contentType:ct,bytes:body.length,file:name,sha256:crypto.createHash('sha256').update(body).digest('hex')});
          }
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({pageStatus:resp.status,revisionId:cfg.revisionId,format:cfg.format,fixedFormat:cfg.fixedFormat,baseUrl:pref.cdn.baseUrl,resourceCount:rows.length,resources:rows},null,2));
          console.log(JSON.stringify(rows,null,2));
          JS
          node /tmp/fetch-prefetch.mjs
          file public-media-analysis/sample-prefetch/resource-* || true
          find public-media-analysis/sample-prefetch -type f -printf '%p\t%s bytes\n' | sort > public-media-analysis/sample-prefetch/FILE-INVENTORY.txt
      - name: Upload prefetch evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-sample-prefetch
          path: public-media-analysis/sample-prefetch
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Persist summary and run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/PREFETCH_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/sample-prefetch/summary.json public-media-analysis/sample-prefetch/prefetch.json public-media-analysis/PREFETCH_RUN_ID.txt
          git commit -m "research: persist Genesis sample prefetch summary $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
