name: Fetch public Genesis sample metadata

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/fetch-genesis-sample-meta.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Fetch public sample metadata
        shell: bash
        run: |
          set -euo pipefail
          out=public-media-analysis/sample-meta
          rm -rf "$out" && mkdir -p "$out"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36'
          curl -fsSL --retry 3 -A "$UA" -D "$out/headers.txt" \
            'https://read.amazon.com/sample/meta/with-fallback/B0FK7RBDFL' \
            -o "$out/metadata.json"
          python -m json.tool "$out/metadata.json" > "$out/metadata.pretty.json" || cp "$out/metadata.json" "$out/metadata.pretty.json"
          python - <<'PY'
          import json, pathlib, re
          out=pathlib.Path('public-media-analysis/sample-meta')
          raw=out.joinpath('metadata.json').read_text(errors='replace')
          try: data=json.loads(raw)
          except Exception as e: data={'parse_error':repr(e),'raw_prefix':raw[:1000]}
          urls=[]
          def walk(x,p='$'):
              if isinstance(x,dict):
                  for k,v in x.items():
                      walk(v,p+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{p}[{i}]')
              elif isinstance(x,str):
                  if x.startswith('http') or '/' in x and any(t in x.lower() for t in ['resource','manifest','content','sample','page']):
                      urls.append({'path':p,'value':x})
          walk(data)
          summary={'top_type':type(data).__name__,'top_keys':sorted(data) if isinstance(data,dict) else None,'strings_of_interest':urls}
          out.joinpath('summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2)[:40000])
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: genesis-sample-metadata
          path: public-media-analysis/sample-meta
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Persist metadata and run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/SAMPLE_META_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/sample-meta public-media-analysis/SAMPLE_META_RUN_ID.txt
          git commit -m "research: persist Genesis sample metadata $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
