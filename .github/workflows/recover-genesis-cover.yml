name: Recover original Genesis cover clue

on:
  push:
    branches:
      - research/cover-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cover-analysis
      - name: Download the exact public cover photograph
        run: |
          set -euo pipefail
          out=public-media-analysis/cover
          mkdir -p "$out"
          curl --fail --location --silent --show-error \
            'https://pbs.twimg.com/media/HK4WjnGXAAAaTYG.jpg?name=orig' \
            -o "$out/opening-cover.jpg"
          file "$out/opening-cover.jpg"
          sha256sum "$out/opening-cover.jpg" > "$out/opening-cover.sha256"
      - name: Generate inspection crops
        run: |
          python -m pip install --disable-pip-version-check -q pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance
          p=Path('public-media-analysis/cover/opening-cover.jpg')
          im=Image.open(p).convert('RGB')
          w,h=im.size
          out=p.parent
          crops={
            'top':(0,0,w,h//3),
            'middle':(0,h//4,w,3*h//4),
            'bottom':(0,2*h//3,w,h),
            'left':(0,0,w//2,h),
            'right':(w//2,0,w,h),
          }
          for name,box in crops.items():
              c=im.crop(box)
              c=c.resize((c.width*2,c.height*2),Image.Resampling.LANCZOS)
              c=ImageEnhance.Contrast(c).enhance(1.25)
              c=ImageEnhance.Sharpness(c).enhance(1.5)
              c.save(out/f'{name}.jpg','JPEG',quality=94)
          print(im.size)
          PY
      - name: Persist cover evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/cover
          git commit -m 'research: add original Genesis cover clue'
          git push origin HEAD:research/cover-analysis
      - name: Upload cover evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-genesis-cover-clue
          path: public-media-analysis/cover
          retention-days: 7
