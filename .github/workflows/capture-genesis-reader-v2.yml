name: Capture public Genesis Kindle sample reader v2

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/capture-genesis-reader-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Persist run identifier immediately
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/READER_CAPTURE_V2_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/READER_CAPTURE_V2_RUN_ID.txt
          git commit -m "research: record Genesis reader v2 run $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight browser controller
        run: |
          which google-chrome
          google-chrome --version
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.54.2

      - name: Write capture program in repository root
        shell: bash
        run: |
          cat > capture-genesis-reader.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const out = 'public-media-analysis/reader-capture-v2';
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(path.join(out, 'responses'), { recursive: true });
          fs.mkdirSync(path.join(out, 'screens'), { recursive: true });

          const network = [];
          const errors = [];
          let browser;
          let context;
          let page;
          const interesting = (url) =>
            url.includes('B0FK7RBDFL') ||
            url.includes('d3lzhnl3ghk4fg.cloudfront.net') ||
            url.includes('/reader-api') ||
            url.includes('/sample/api/') ||
            url.includes('/sample/meta') ||
            url.includes('/service/web/content/') ||
            url.includes('/service/web/reader/') ||
            url.includes('/renderer/') ||
            url.includes('karamel') ||
            url.includes('rsrc');

          const persist = async (fatal = null) => {
            if (fatal) errors.push({ type: 'fatal', message: String(fatal), stack: fatal?.stack || null });
            fs.writeFileSync(path.join(out, 'network.json'), JSON.stringify(network, null, 2));
            fs.writeFileSync(path.join(out, 'errors.json'), JSON.stringify(errors, null, 2));
            if (context) {
              try { fs.writeFileSync(path.join(out, 'cookies.json'), JSON.stringify(await context.cookies(), null, 2)); } catch {}
            }
            fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify({
              finalUrl: page?.url?.() || null,
              networkCount: network.length,
              interestingResponses: network.filter(x => interesting(x.url)).length,
              savedResponseFiles: fs.existsSync(path.join(out, 'responses')) ? fs.readdirSync(path.join(out, 'responses')).length : 0,
              errorCount: errors.length,
              fatal: fatal ? String(fatal) : null,
            }, null, 2));
          };

          const snapshot = async (label) => {
            if (!page) return;
            const data = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              bodyText: document.body?.innerText || '',
              html: document.documentElement?.outerHTML || '',
              localStorage: Object.fromEntries(Object.entries(localStorage)),
              sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
              canvases: [...document.querySelectorAll('canvas')].map((c,i)=>({
                i, width:c.width, height:c.height,
                rect:(()=>{const r=c.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()
              })),
              images: [...document.images].map((im,i)=>({
                i, src:im.currentSrc||im.src, alt:im.alt,
                width:im.naturalWidth, height:im.naturalHeight,
                rect:(()=>{const r=im.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()
              })),
              controls: [...document.querySelectorAll('button,[role=button],a')].map((el,i)=>({
                i, id:el.id||null, cls:typeof el.className==='string'?el.className:null,
                aria:el.getAttribute('aria-label'), title:el.getAttribute('title'),
                text:(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,200)
              })).filter(x=>x.aria||x.title||x.text),
            }));
            fs.writeFileSync(path.join(out, `${label}.json`), JSON.stringify({ ...data, html: undefined }, null, 2));
            fs.writeFileSync(path.join(out, `${label}.html`), data.html);
            await page.screenshot({ path: path.join(out, 'screens', `${label}.png`), fullPage: true });
          };

          try {
            browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-blink-features=AutomationControlled'],
            });
            context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              locale: 'en-US',
            });
            page = await context.newPage();
            page.on('requestfailed', req => errors.push({ type: 'requestfailed', url: req.url(), failure: req.failure() }));
            page.on('pageerror', err => errors.push({ type: 'pageerror', message: String(err), stack: err?.stack || null }));
            page.on('console', msg => {
              if (msg.type() === 'error' || msg.type() === 'warning') errors.push({ type: `console-${msg.type()}`, text: msg.text() });
            });
            page.on('response', async response => {
              const req = response.request();
              const headers = await response.allHeaders().catch(() => ({}));
              const record = {
                url: response.url(), status: response.status(), method: req.method(),
                resourceType: req.resourceType(), contentType: headers['content-type'] || '',
                contentLength: headers['content-length'] || null,
                postData: interesting(response.url()) ? req.postData() : null,
              };
              network.push(record);
              if (!interesting(response.url()) || response.status() >= 400) return;
              try {
                const body = await response.body();
                if (body.length > 24 * 1024 * 1024) return;
                const hash = crypto.createHash('sha256').update(response.url()).digest('hex').slice(0, 16);
                let ext = '.bin'; const ct = record.contentType;
                if (ct.includes('json')) ext = '.json'; else if (ct.includes('javascript')) ext = '.js';
                else if (ct.includes('html')) ext = '.html'; else if (ct.includes('png')) ext = '.png';
                else if (ct.includes('jpeg') || ct.includes('jpg')) ext = '.jpg';
                else if (ct.includes('svg')) ext = '.svg'; else if (ct.includes('text')) ext = '.txt';
                fs.writeFileSync(path.join(out, 'responses', `${hash}${ext}`), body);
                fs.writeFileSync(path.join(out, 'responses', `${hash}.meta.json`), JSON.stringify(record, null, 2));
              } catch (e) { errors.push({ type: 'response-body', url: response.url(), error: String(e) }); }
            });

            await page.goto('https://read.amazon.com/sample/B0FK7RBDFL?clientId=share', {
              waitUntil: 'domcontentloaded', timeout: 120000
            });
            await page.waitForTimeout(15000);
            await snapshot('state-00');

            for (let i = 1; i <= 32; i++) {
              let acted = false;
              for (const sel of [
                '#sitbreaderrightpageturner',
                '[aria-label*="Next"]', '[aria-label*="next"]',
                '.sitbreaderrightpageturner', '[data-testid*="right"]'
              ]) {
                const loc = page.locator(sel).first();
                if (await loc.count()) {
                  try { await loc.click({ timeout: 1200 }); acted = true; break; } catch {}
                }
              }
              if (!acted) await page.keyboard.press('ArrowRight');
              await page.waitForTimeout(1000);
              if (i <= 10 || i % 4 === 0) {
                try { await snapshot(`state-${String(i).padStart(2,'0')}`); }
                catch (e) { errors.push({ type:'snapshot', index:i, error:String(e) }); }
              }
            }
            await persist();
          } catch (e) {
            await persist(e);
            process.exitCode = 1;
          } finally {
            try { await browser?.close(); } catch {}
          }
          JS

      - name: Run capture
        shell: bash
        run: node ./capture-genesis-reader.mjs
        continue-on-error: true

      - name: Inventory partial or complete output
        if: always()
        shell: bash
        run: |
          mkdir -p public-media-analysis/reader-capture-v2
          find public-media-analysis/reader-capture-v2 -type f -printf '%p\t%s bytes\n' | sort > public-media-analysis/reader-capture-v2/FILE-INVENTORY.txt
          cat public-media-analysis/reader-capture-v2/summary.json || true

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-reader-capture-v2
          path: public-media-analysis/reader-capture-v2
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Persist capture summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in summary.json network.json errors.json state-00.json FILE-INVENTORY.txt; do
            test -f "public-media-analysis/reader-capture-v2/$f" && git add "public-media-analysis/reader-capture-v2/$f" || true
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist Genesis reader v2 capture $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
