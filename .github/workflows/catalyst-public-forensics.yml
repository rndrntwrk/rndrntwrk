name: Catalyst public-chain forensics

on:
  push:
    branches:
      - forensics/catalyst-api-bridge-20260826
    paths:
      - forensics/catalyst/run.py
      - .github/workflows/catalyst-public-forensics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out isolated analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only parsing dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi solders

      - name: Reconstruct pre-bond trades and wallet clusters
        env:
          MAX_SIGNATURES: '30000'
          MAX_TX: '30000'
          MAX_CURRENT_BALANCES: '100'
          MAX_FUNDERS: '35'
          MAX_GMGN: '60'
        run: python forensics/catalyst/run.py

      - name: Commit evidence to the isolated branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics/catalyst/output
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
            exit 0
          fi
          git commit -m 'Record catalyst pre-bond forensic evidence'
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-public-chain-forensics
          path: forensics/catalyst/output/
          if-no-files-found: warn
          retention-days: 7
