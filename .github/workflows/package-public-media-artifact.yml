name: Package recovered public clue media

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/package-public-media-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Build evidence archive
        run: |
          set -euo pipefail
          tar -czf public-media-analysis.tar.gz public-media-analysis
          sha256sum public-media-analysis.tar.gz > public-media-analysis.tar.gz.sha256
      - name: Upload evidence archive
        uses: actions/upload-artifact@v4
        with:
          name: public-media-analysis-evidence
          path: |
            public-media-analysis.tar.gz
            public-media-analysis.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
