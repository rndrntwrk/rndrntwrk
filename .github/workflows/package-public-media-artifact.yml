name: Package recovered public clue media

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/package-public-media-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Build evidence archive
        run: |
          set -euo pipefail
          tar -czf public-media-analysis.tar.gz public-media-analysis
          sha256sum public-media-analysis.tar.gz > public-media-analysis.tar.gz.sha256
      - name: Upload evidence archive
        uses: actions/upload-artifact@v4
        with:
          name: public-media-analysis-evidence
          path: |
            public-media-analysis.tar.gz
            public-media-analysis.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Persist workflow run id
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/PACKAGE_ARTIFACT_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/PACKAGE_ARTIFACT_RUN_ID.txt
          git commit -m 'research: persist package artifact run id' || exit 0
          git push origin HEAD:research/public-media-analysis
