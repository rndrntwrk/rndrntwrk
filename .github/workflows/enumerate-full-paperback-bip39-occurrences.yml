name: Enumerate full paperback BIP39 page occurrences

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/enumerate-full-paperback-bip39-occurrences.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check -q aiohttp

      - name: Enumerate every occurrence page for every BIP39 word
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/enumerate_all_occurrences.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import math
          import random
          import re
          import time
          from collections import Counter, defaultdict
          from pathlib import Path

          import aiohttp

          ASIN = "B0FRGB2PMR"
          CARD = f"https://read.amazon.com/sample/{ASIN}?clientId=share"
          ENDPOINT = "https://read.amazon.com/sample/print/search-results"
          OUT = Path("public-media-analysis/full-paperback-bip39-occurrences")
          WORDLIST = Path("public-media-analysis/wordlists/bip39-english.txt")
          PAGE_SIZE = 100
          TARGET_PRINTED = {103, 110, 241}
          CONTROL_PRINTED = {14, 19, 21, 24, 32}
          INTEREST_PRINTED = TARGET_PRINTED | CONTROL_PRINTED
          # Amazon scan id is printed page + 9 for this edition.
          EXPECTED_SCAN = {p: p + 9 for p in INTEREST_PRINTED}
          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
          )

          words = [w.strip() for w in WORDLIST.read_text().splitlines() if w.strip()]
          if len(words) != 2048:
              raise SystemExit(f"expected 2048 BIP39 words, got {len(words)}")

          OUT.mkdir(parents=True, exist_ok=True)
          sem = asyncio.Semaphore(12)
          timeout = aiohttp.ClientTimeout(total=35, connect=10, sock_read=25)
          statuses: Counter[str] = Counter()
          page_words: defaultdict[int, list[dict]] = defaultdict(list)
          records: dict[str, dict] = {}
          errors: list[dict] = []
          completed_words = 0
          requests_made = 0
          started = time.time()
          state_lock = asyncio.Lock()

          def parse_printed(label: object) -> int | None:
              if not isinstance(label, str):
                  return None
              m = re.fullmatch(r"Page\s+(\d+)", label.strip(), flags=re.I)
              return int(m.group(1)) if m else None

          def normalize_results(obj: object) -> list[list]:
              if not isinstance(obj, dict):
                  return []
              rows = obj.get("results")
              return rows if isinstance(rows, list) else []

          async def fetch_json(session: aiohttp.ClientSession, word: str, page_number: int) -> tuple[dict | None, str | None]:
              nonlocal requests_made
              params = {
                  "asin": ASIN,
                  "buyingAsin": ASIN,
                  "query": word,
                  "pageNumber": str(page_number),
                  "pageSize": str(PAGE_SIZE),
              }
              last = None
              for attempt in range(6):
                  try:
                      async with sem:
                          async with session.get(ENDPOINT, params=params, timeout=timeout) as r:
                              text = await r.text()
                              mime = r.headers.get("content-type", "").partition(";")[0]
                              statuses[f"{r.status} {mime}"] += 1
                              requests_made += 1
                      if r.status in {429, 500, 502, 503, 504}:
                          last = f"HTTP {r.status}: {text[:200]}"
                          await asyncio.sleep(0.5 * (2 ** attempt) + random.random() * 0.3)
                          continue
                      try:
                          return json.loads(text), None
                      except Exception as exc:
                          return None, f"JSON {exc!r}: {text[:200]}"
                  except Exception as exc:
                      last = repr(exc)
                      await asyncio.sleep(0.5 * (2 ** attempt) + random.random() * 0.3)
              return None, last

          def process_rows(word: str, rows: list[list], seen: set[tuple]) -> list[dict]:
              parsed = []
              for row in rows:
                  if not isinstance(row, list) or len(row) < 2:
                      continue
                  scan_raw = row[0]
                  label = row[1]
                  try:
                      scan_page = int(scan_raw)
                  except (TypeError, ValueError):
                      scan_page = None
                  printed_page = parse_printed(label)
                  key = (scan_page, printed_page)
                  if key in seen:
                      continue
                  seen.add(key)
                  rec = {
                      "scan_page": scan_page,
                      "printed_page": printed_page,
                      "label": label,
                      "context": row[2] if len(row) > 2 else None,
                  }
                  parsed.append(rec)
                  if printed_page in INTEREST_PRINTED:
                      page_words[printed_page].append({"word": word, **rec})
              return parsed

          async def one_word(session: aiohttp.ClientSession, word: str) -> None:
              nonlocal completed_words
              obj, error = await fetch_json(session, word, 1)
              if error or obj is None:
                  async with state_lock:
                      errors.append({"word": word, "page_number": 1, "error": error})
                      completed_words += 1
                  return

              try:
                  total = int(obj.get("totalResults") or 0)
              except Exception:
                  total = 0
              seen: set[tuple] = set()
              occurrences = process_rows(word, normalize_results(obj), seen)
              page_count = max(1, math.ceil(total / PAGE_SIZE)) if total else 1

              if page_count > 1:
                  later = await asyncio.gather(
                      *(fetch_json(session, word, p) for p in range(2, page_count + 1))
                  )
                  for page_number, (later_obj, later_error) in enumerate(later, start=2):
                      if later_error or later_obj is None:
                          errors.append({"word": word, "page_number": page_number, "error": later_error})
                          continue
                      occurrences.extend(process_rows(word, normalize_results(later_obj), seen))

              records[word] = {
                  "total_results": total,
                  "result_pages_requested": page_count,
                  "occurrence_count": len(occurrences),
                  "occurrences": occurrences,
              }
              async with state_lock:
                  completed_words += 1
                  if completed_words % 128 == 0:
                      partial = {
                          "completed_words": completed_words,
                          "requests_made": requests_made,
                          "error_count": len(errors),
                          "page_words": {
                              str(p): sorted({x["word"] for x in page_words[p]})
                              for p in sorted(INTEREST_PRINTED)
                          },
                          "elapsed_seconds": time.time() - started,
                      }
                      (OUT / "partial.json").write_text(json.dumps(partial, indent=2))
                      print(
                          "completed=%d requests=%d p103=%d p110=%d p241=%d errors=%d elapsed=%.1f"
                          % (
                              completed_words,
                              requests_made,
                              len({x['word'] for x in page_words[103]}),
                              len({x['word'] for x in page_words[110]}),
                              len({x['word'] for x in page_words[241]}),
                              len(errors),
                              time.time() - started,
                          ),
                          flush=True,
                      )

          async def main() -> None:
              jar = aiohttp.CookieJar(unsafe=True)
              connector = aiohttp.TCPConnector(limit=16, ttl_dns_cache=300)
              headers = {"User-Agent": UA, "Accept": "application/json,text/html,*/*"}
              async with aiohttp.ClientSession(
                  headers=headers, cookie_jar=jar, connector=connector
              ) as session:
                  async with session.get(CARD, timeout=timeout) as r:
                      await r.read()
                      print("CARD", r.status, str(r.url), flush=True)
                  for start in range(0, len(words), 96):
                      await asyncio.gather(*(one_word(session, w) for w in words[start:start+96]))

          asyncio.run(main())

          compact_pages = {}
          for printed_page in sorted(INTEREST_PRINTED):
              entries = page_words[printed_page]
              by_word = {}
              for item in entries:
                  word = item["word"]
                  by_word.setdefault(word, {
                      "word": word,
                      "scan_pages": set(),
                      "contexts": [],
                  })
                  if item["scan_page"] is not None:
                      by_word[word]["scan_pages"].add(item["scan_page"])
                  if item.get("context") and item["context"] != word:
                      by_word[word]["contexts"].append(item["context"])
              compact_pages[str(printed_page)] = [
                  {
                      "word": word,
                      "scan_pages": sorted(data["scan_pages"]),
                      "contexts": data["contexts"][:5],
                  }
                  for word, data in sorted(by_word.items())
              ]

          validation = {}
          for printed_page in sorted(CONTROL_PRINTED):
              expected = EXPECTED_SCAN[printed_page]
              scans = sorted({
                  s
                  for item in compact_pages[str(printed_page)]
                  for s in item["scan_pages"]
              })
              validation[str(printed_page)] = {
                  "expected_scan_page": expected,
                  "observed_scan_pages": scans,
                  "offset_confirmed": expected in scans,
                  "word_count": len(compact_pages[str(printed_page)]),
              }

          summary = {
              "asin": ASIN,
              "wordlist_size": len(words),
              "completed_words": completed_words,
              "requests_made": requests_made,
              "status_counts": dict(statuses),
              "error_count": len(errors),
              "control_validation": validation,
              "pages": compact_pages,
              "target_words": {
                  str(p): [x["word"] for x in compact_pages[str(p)]]
                  for p in sorted(TARGET_PRINTED)
              },
              "elapsed_seconds": time.time() - started,
          }
          (OUT / "summary.json").write_text(json.dumps(summary, indent=2, ensure_ascii=False))
          (OUT / "records.json").write_text(json.dumps(records, indent=2, ensure_ascii=False))
          (OUT / "errors.json").write_text(json.dumps(errors, indent=2, ensure_ascii=False))

          lines = [
              "# Full paperback BIP39 occurrence enumeration",
              "",
              f"- BIP39 words completed: {completed_words:,} / {len(words):,}",
              f"- HTTP requests: {requests_made:,}",
              f"- Errors: {len(errors):,}",
              f"- Elapsed: {summary['elapsed_seconds']:.1f} seconds",
              "",
          ]
          for p in sorted(CONTROL_PRINTED):
              words_here = summary["pages"][str(p)]
              lines += [
                  f"## Control printed page {p}",
                  "",
                  ", ".join(f"`{x['word']}`" for x in words_here) or "_No BIP39 words._",
                  "",
              ]
          for p in sorted(TARGET_PRINTED):
              words_here = summary["pages"][str(p)]
              lines += [
                  f"## Target printed page {p}",
                  "",
                  ", ".join(f"`{x['word']}`" for x in words_here) or "_No BIP39 words._",
                  "",
              ]
              for item in words_here:
                  if item["contexts"]:
                      lines.append(f"- `{item['word']}`: {item['contexts'][0]}")
              lines.append("")
          (OUT / "summary.md").write_text("\n".join(lines) + "\n")
          print(json.dumps(summary["target_words"], indent=2), flush=True)
          PY
          python /tmp/enumerate_all_occurrences.py | tee /tmp/full-occurrences.log
          cp /tmp/full-occurrences.log public-media-analysis/full-paperback-bip39-occurrences/console.log

      - name: Upload occurrence enumeration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-paperback-bip39-occurrences
          path: public-media-analysis/full-paperback-bip39-occurrences
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Persist occurrence enumeration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/full-paperback-bip39-occurrences || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist full paperback BIP39 occurrences $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
