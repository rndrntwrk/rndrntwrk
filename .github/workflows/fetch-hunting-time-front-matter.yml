name: Fetch Hunting Time front matter

on:
  push:
    branches:
      - research/hunting-time-amazon-probe
    paths:
      - .github/workflows/fetch-hunting-time-front-matter.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hunting-time-amazon-probe
          fetch-depth: 0
      - name: Fetch pages 1 through 18
        run: |
          set -euxo pipefail
          out=public-media-analysis/front-matter
          rm -rf "$out"
          mkdir -p "$out/images" "$out/json"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card='https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'
          curl -L --compressed --retry 3 -sS -A "$ua" -c "$out/cookies.txt" "$card" -o "$out/card.html"
          python - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path
          out=Path('public-media-analysis/front-matter')
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card='https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'
          cookies=str(out/'cookies.txt')
          all_assets={}
          summary=[]
          for page in [1,2,3,5,8,10,12,14]:
              params={'asin':'B0FK7RBDFL','buyingAsin':'B0FK7RBDFL','page':str(page),'token':'null'}
              url='https://read.amazon.com/sample/print/go-to-page?'+urllib.parse.urlencode(params)
              body=out/'json'/f'request-{page:03d}.body'
              hdr=out/'json'/f'request-{page:03d}.headers'
              p=subprocess.run(['curl','-L','--compressed','--retry','3','-sS','-A',ua,'-b',cookies,'-c',cookies,'-e',card,'-H','Accept: application/json','-D',str(hdr),url,'-o',str(body),'-w','%{http_code}\t%{content_type}\n'],capture_output=True,text=True)
              raw=body.read_bytes() if body.exists() else b''
              rec={'request_page':page,'status':p.stdout.strip(),'stderr':p.stderr.strip(),'bytes':len(raw)}
              try:
                  obj=json.loads(raw)
                  rec['json']=obj
                  body.with_suffix('.pretty.json').write_text(json.dumps(obj,indent=2,ensure_ascii=False))
                  urls=obj.get('jumboImageUrls') or obj.get('largeImageUrls') or {} if isinstance(obj,dict) else {}
                  if isinstance(urls,dict):
                      for sub,u in urls.items(): all_assets.setdefault(str(sub),u)
              except Exception as e:
                  rec['parse_error']=repr(e); rec['prefix']=raw[:1000].decode('utf-8','replace')
              summary.append(rec)
          for sub,u in sorted(all_assets.items(),key=lambda kv:int(kv[0])):
              if int(sub)>18: continue
              ip=out/'images'/f'page-{int(sub):03d}.jpg'
              q=subprocess.run(['curl','-L','--compressed','--retry','3','-sS','-A',ua,'-e',card,u,'-o',str(ip),'-w','%{http_code}\t%{content_type}\n'],capture_output=True,text=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
          find "$out" -type f -printf '%P\t%s bytes\n' | sort > "$out/FILE_INDEX.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'research: persist Hunting Time front matter pages'
          git push origin HEAD:research/hunting-time-amazon-probe
