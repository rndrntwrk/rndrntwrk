name: Bundle Hunting Time isolated Amazon probe

on:
  push:
    branches:
      - research/hunting-time-amazon-probe
    paths:
      - .github/workflows/bundle-hunting-time-amazon-probe.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hunting-time-amazon-probe
          fetch-depth: 0
      - name: Upload probe files
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-amazon-isolated-probe
          path: public-media-analysis/amazon-isolated-probe
          if-no-files-found: error
          retention-days: 1
      - name: Record artifact coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('public-media-analysis/amazon-isolated-probe-bundle.json')
          p.write_text(json.dumps({
            'run_id': int(os.environ['RUN_ID']),
            'artifact_id': int(os.environ['ARTIFACT_ID']),
            'artifact_url': os.environ.get('ARTIFACT_URL','')
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/amazon-isolated-probe-bundle.json
          git commit -m 'research: record isolated Amazon probe artifact'
          git push origin HEAD:research/hunting-time-amazon-probe
