name: Catalyst GMGN peak forensics

on:
  push:
    branches:
      - forensics/catalyst-api-bridge-20260826
    paths:
      - .github/workflows/catalyst-gmgn-peak-forensics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out isolated analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install indexed-feed client
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Paginate through the post-bond peak and first retrace
        env:
          GMGN_MAX_PAGES: '3000'
          GMGN_PAGE_LIMIT: '50'
          STOP_AFTER_SECONDS: '7200'
          MAX_WALLET_STATS: '80'
        run: python forensics/catalyst/gmgn_forensics.py

      - name: Commit peak-window evidence to the isolated branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forensics/catalyst/output
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
            exit 0
          fi
          git commit -m 'Extend catalyst evidence through post-bond peak'
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload peak-window evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-gmgn-peak-forensics
          path: forensics/catalyst/output/
          if-no-files-found: warn
          retention-days: 7
