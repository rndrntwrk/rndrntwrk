name: Generate compact clue previews

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/make-public-media-previews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Generate compact previews
        run: |
          python -m pip install --disable-pip-version-check -q pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root=Path('public-media-analysis')
          out=root/'previews'
          out.mkdir(exist_ok=True)
          font=ImageFont.load_default(size=16)

          tiles=[]
          for i,path in enumerate(sorted(root.glob('clue-*.jpg')),1):
              im=Image.open(path).convert('RGB')
              tile=ImageOps.fit(im,(240,170),method=Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(240,194),'white')
              canvas.paste(tile,(0,24))
              ImageDraw.Draw(canvas).text((8,4),f'CLUE {i:02d}',fill='black',font=font)
              canvas.save(out/f'clue-{i:02d}-preview.jpg','JPEG',quality=32,optimize=True,progressive=True)
              tiles.append(canvas)

          sheet=Image.new('RGB',(960,582),(230,230,230))
          for idx,tile in enumerate(tiles):
              x=(idx%4)*240; y=(idx//4)*194
              sheet.paste(tile,(x,y))
          sheet.save(out/'all-clues-contact-sheet.jpg','JPEG',quality=30,optimize=True,progressive=True)

          selected=[]
          for i in (2,5,10):
              im=Image.open(root/f'clue-{i:02d}.jpg').convert('RGB')
              tile=ImageOps.contain(im,(440,300),method=Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(460,340),'white')
              x=(460-tile.width)//2; y=36+(300-tile.height)//2
              canvas.paste(tile,(x,y))
              ImageDraw.Draw(canvas).text((8,7),f'UNNUMBERED CLUE {i:02d}',fill='black',font=font)
              selected.append(canvas)
          unnumbered=Image.new('RGB',(1380,340),(230,230,230))
          for idx,tile in enumerate(selected): unnumbered.paste(tile,(idx*460,0))
          unnumbered.save(out/'unnumbered-clues-contact-sheet.jpg','JPEG',quality=42,optimize=True,progressive=True)

          for p in sorted(out.glob('*.jpg')):
              print(p,p.stat().st_size)
          PY

      - name: Persist previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/previews
          git commit -m 'research: add compact clue previews'
          git push origin HEAD:research/public-media-analysis
