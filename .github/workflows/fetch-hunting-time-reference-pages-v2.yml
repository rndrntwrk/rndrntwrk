name: Fetch Hunting Time reference pages v2

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/fetch-hunting-time-reference-pages-v2.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Fetch selected public Look Inside pages and OCR them
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python - <<'PY'
          import json, re, subprocess, urllib.parse
          from pathlib import Path

          out = Path('/tmp/hunting-time-reference-pages-v2')
          (out / 'json').mkdir(parents=True, exist_ok=True)
          (out / 'images').mkdir(parents=True, exist_ok=True)
          (out / 'ocr').mkdir(parents=True, exist_ok=True)

          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card = 'https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'
          cookie = out / 'cookies.txt'
          subprocess.run(['curl','-L','--compressed','--retry','3','--fail','-sS','-A',ua,'-c',str(cookie),card,'-o',str(out/'card.html')], check=True)

          pages = [14, 19, 21, 24, 32, 47, 58]
          manifest = []
          for page in pages:
              params = {'asin':'B0FK7RBDFL','buyingAsin':'B0FK7RBDFL','page':str(page),'token':'null'}
              endpoint = 'https://read.amazon.com/sample/print/go-to-page?' + urllib.parse.urlencode(params)
              body = out/'json'/f'page-{page:03d}.json'
              p = subprocess.run([
                  'curl','-L','--compressed','--retry','3','--fail','-sS','-A',ua,
                  '-b',str(cookie),'-c',str(cookie),'-e',card,endpoint,'-o',str(body),
                  '-w','%{http_code}\t%{content_type}\n'
              ], capture_output=True, text=True)
              rec = {'page':page,'endpoint':endpoint,'curl':p.stdout.strip(),'stderr':p.stderr.strip(),'bytes':body.stat().st_size if body.exists() else 0}
              if p.returncode != 0:
                  rec['error'] = f'curl return code {p.returncode}'
                  manifest.append(rec)
                  continue
              obj = json.loads(body.read_text())
              body.write_text(json.dumps(obj, indent=2, ensure_ascii=False))
              rec['response_keys'] = sorted(obj) if isinstance(obj, dict) else []
              urls = (obj.get('jumboImageUrls') or obj.get('largeImageUrls') or {}) if isinstance(obj, dict) else {}
              url = urls.get(str(page)) if isinstance(urls, dict) else None
              if not url and isinstance(urls, dict) and urls:
                  url = next(iter(urls.values()))
              if not url:
                  rec['response'] = obj
                  manifest.append(rec)
                  continue
              image = out/'images'/f'page-{page:03d}.jpg'
              q = subprocess.run(['curl','-L','--compressed','--retry','3','--fail','-sS','-A',ua,'-e',card,url,'-o',str(image),'-w','%{http_code}\t%{content_type}\n'], capture_output=True, text=True)
              rec['image_curl'] = q.stdout.strip()
              rec['image_stderr'] = q.stderr.strip()
              rec['image_bytes'] = image.stat().st_size if image.exists() else 0
              rec['image_url'] = url
              if q.returncode == 0 and image.exists():
                  txtbase = out/'ocr'/f'page-{page:03d}'
                  subprocess.run(['tesseract',str(image),str(txtbase),'--psm','6'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  txt = txtbase.with_suffix('.txt')
                  rec['ocr'] = txt.read_text(errors='ignore') if txt.exists() else ''
              manifest.append(rec)

          words = [w.strip() for w in Path('public-media-analysis/wordlists/bip39-english.txt').read_text().splitlines() if w.strip()]
          wordset = set(words)
          for rec in manifest:
              tokens = re.findall(r"[A-Za-z]+", rec.get('ocr','').lower())
              rec['bip39_on_page'] = sorted(set(tokens) & wordset, key=lambda w: words.index(w))

          (out/'manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False))
          lines=[]
          for rec in manifest:
              lines.append(f"PAGE {rec['page']}: {', '.join(rec.get('bip39_on_page', []))}")
              lines.append(rec.get('ocr','').strip())
              lines.append('---')
          (out/'summary.txt').write_text('\n'.join(lines))
          PY

      - name: Upload selected reference pages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-reference-pages-v2
          path: /tmp/hunting-time-reference-pages-v2
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('public-media-analysis/reference-pages-v2-run.json').write_text(json.dumps({
              'run_id': int(os.environ['RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_url': os.environ.get('ARTIFACT_URL','')
          }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/reference-pages-v2-run.json
          git commit -m 'research: record selected reference pages artifact'
          git push origin HEAD:research/public-media-analysis
