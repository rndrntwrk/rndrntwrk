name: Package public media analysis inputs

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/package-public-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Verify evidence files
        run: |
          set -euo pipefail
          test "$(find public-media-analysis -maxdepth 1 -name 'clue-*.jpg' | wc -l)" -eq 12
          sha256sum public-media-analysis/clue-*.jpg > public-media-analysis/SHA256SUMS.txt
          find public-media-analysis -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload exact evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-media-analysis-evidence
          path: public-media-analysis
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist package run identifier
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/PACKAGE_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/PACKAGE_RUN_ID.txt
          git commit -m "research: record evidence package run $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
