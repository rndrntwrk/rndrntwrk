name: GitHub Profile 3D Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove language and vanity stats blocks
        run: node scripts/clean-3d-contrib.mjs
      - name: Commit generated profile graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update 3D contribution graph"
          git push

  hunting-time-anchor-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Record workflow run
        run: |
          mkdir -p public-media-analysis/target-page-anchors
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/target-page-anchors/RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/target-page-anchors/RUN_ID.txt
          git commit -m "research: record anchor scan $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis

      - name: Scan scene anchors
        run: python scripts/hunting_time_anchor_scan.py

      - name: Upload complete scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-target-page-anchor-scan
          path: public-media-analysis/target-page-anchors
          if-no-files-found: warn
          retention-days: 7

      - name: Persist concise results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/target-page-anchors/anchor-results.json || true
          git add public-media-analysis/target-page-anchors/anchor-results.md || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist anchor scan $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
