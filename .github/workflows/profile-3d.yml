name: GitHub Profile 3D Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove language and vanity stats blocks
        run: node scripts/clean-3d-contrib.mjs
      - name: Commit generated profile graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update 3D contribution graph"
          git push

  hunting-time-full-occurrence-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check -q aiohttp

      - name: Record workflow run
        run: |
          mkdir -p public-media-analysis/full-paperback-bip39-occurrences
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/full-paperback-bip39-occurrences/RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/full-paperback-bip39-occurrences/RUN_ID.txt
          git commit -m "research: record fixed occurrence scan $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis

      - name: Extract, compile, and run reviewed enumerator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/enumerate-full-paperback-bip39-occurrences.yml').read_text()
          start_marker = "cat > /tmp/enumerate_all_occurrences.py <<'PY'\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/enumerate_all_occurrences.py').write_text(code)
          print('extracted', len(code), 'bytes')
          PY
          python -m py_compile /tmp/enumerate_all_occurrences.py
          python /tmp/enumerate_all_occurrences.py | tee /tmp/full-occurrences.log
          cp /tmp/full-occurrences.log public-media-analysis/full-paperback-bip39-occurrences/console.log

      - name: Upload complete scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-full-paperback-bip39-occurrences
          path: public-media-analysis/full-paperback-bip39-occurrences
          if-no-files-found: warn
          retention-days: 7

      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/full-paperback-bip39-occurrences || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist fixed full occurrence scan $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
