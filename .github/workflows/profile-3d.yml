name: GitHub Profile 3D Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove language and vanity stats blocks
        run: node scripts/clean-3d-contrib.mjs
      - name: Commit generated profile graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update 3D contribution graph"
          git push

  retrieve-target-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Record page-retrieval run
        run: |
          mkdir -p public-media-analysis/target-page-images
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/target-page-images/RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/target-page-images/RUN_ID.txt
          git commit -m "research: record target-page retrieval $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check -q pillow pytesseract

      - name: Retrieve pages 103, 110 and 241 and OCR them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          import pytesseract
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          ASIN = 'B0FRGB2PMR'
          ENDPOINT = 'https://read.amazon.com/sample/print/search-results'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          TARGETS = [
              {'printed': 103, 'internal': '112', 'query': 'height'},
              {'printed': 110, 'internal': '119', 'query': 'bomb'},
              {'printed': 241, 'internal': '250', 'query': 'inhale'},
          ]
          OUT = Path('public-media-analysis/target-page-images')
          OUT.mkdir(parents=True, exist_ok=True)

          def request_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'User-Agent': UA,
                      'Referer': f'https://read.amazon.com/kp/card?asin={ASIN}&preview=inline&linkCode=kpe',
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read())

          def download(url: str, destination: Path):
              request = urllib.request.Request(url, headers={'User-Agent': UA, 'Referer': 'https://read.amazon.com/'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              destination.write_bytes(data)
              return data

          def find_entries(value, label):
              found = []
              if isinstance(value, list):
                  strings = [str(item) for item in value]
                  if label in strings:
                      found.append(value)
                  for child in value:
                      found.extend(find_entries(child, label))
              elif isinstance(value, dict):
                  for child in value.values():
                      found.extend(find_entries(child, label))
              return found

          def ocr_variants(image: Image.Image):
              gray = ImageOps.grayscale(image)
              variants = {
                  'gray': gray,
                  'autocontrast': ImageOps.autocontrast(gray),
                  'contrast2': ImageEnhance.Contrast(gray).enhance(2.0),
                  'sharpen': ImageOps.autocontrast(gray).filter(ImageFilter.SHARPEN),
              }
              records = []
              for name, variant in variants.items():
                  for psm in (3, 4, 6, 11, 12):
                      text = pytesseract.image_to_string(variant, config=f'--oem 3 --psm {psm}').strip()
                      if text:
                          records.append({'variant': name, 'psm': psm, 'text': text})
              return records

          results = []
          for target in TARGETS:
              params = {
                  'asin': ASIN,
                  'buyingAsin': ASIN,
                  'query': target['query'],
                  'pageNumber': 1,
                  'pageSize': 100,
              }
              response = request_json(ENDPOINT + '?' + urllib.parse.urlencode(params))
              label = f"Page {target['printed']}"
              entries = find_entries(response, label)
              urls = response.get('jumboImageUrls') or {}
              page_url = urls.get(target['internal']) or urls.get(str(target['printed']))
              if not page_url:
                  # Some responses use numeric keys that are integers after JSON decoding.
                  page_url = urls.get(int(target['internal'])) if isinstance(urls, dict) else None
              if not page_url:
                  raise RuntimeError(
                      f"No image URL for {label}; internal={target['internal']}; "
                      f"keys={list(urls)[:30]}; entries={entries[:3]}"
                  )

              image_path = OUT / f"page-{target['printed']:03d}.jpg"
              data = download(page_url, image_path)
              image = Image.open(image_path).convert('RGB')
              records = ocr_variants(image)

              unique = []
              seen = set()
              for record in records:
                  compact = '\n'.join(line.rstrip() for line in record['text'].splitlines()).strip()
                  if compact and compact not in seen:
                      seen.add(compact)
                      unique.append(compact)

              result = {
                  **target,
                  'label': label,
                  'entries': entries,
                  'responseTotalResults': response.get('totalResults'),
                  'imageKeyCount': len(urls),
                  'imageSize': list(image.size),
                  'imageBytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'ocr': records,
                  'uniqueOCR': unique,
              }
              results.append(result)
              (OUT / f"page-{target['printed']:03d}-ocr.txt").write_text(
                  '\n\n===== OCR VARIANT =====\n\n'.join(unique), encoding='utf-8'
              )
              (OUT / f"page-{target['printed']:03d}-response.json").write_text(
                  json.dumps(response, indent=2, ensure_ascii=False), encoding='utf-8'
              )

          (OUT / 'results.json').write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
          lines = ['# Retrieved target paperback pages', '']
          for result in results:
              lines += [
                  f"## {result['label']}",
                  '',
                  f"- Query: `{result['query']}`",
                  f"- Internal page: `{result['internal']}`",
                  f"- Image: {result['imageSize'][0]} × {result['imageSize'][1]}, {result['imageBytes']} bytes",
                  f"- SHA-256: `{result['sha256']}`",
                  f"- Search entry: `{json.dumps(result['entries'][:3], ensure_ascii=False)}`",
                  '',
                  '### OCR',
                  '',
                  '```text',
                  (result['uniqueOCR'][0] if result['uniqueOCR'] else '[no OCR text]')[:12000],
                  '```',
                  '',
              ]
          (OUT / 'results.md').write_text('\n'.join(lines), encoding='utf-8')
          print((OUT / 'results.md').read_text())
          PY

      - name: Upload page-analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-target-page-images
          path: public-media-analysis/target-page-images
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Persist OCR and metadata
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find public-media-analysis/target-page-images -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' -o -name '*-ocr.txt' \) -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist target-page OCR $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
