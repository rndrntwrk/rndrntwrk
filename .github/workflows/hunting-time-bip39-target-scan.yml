name: Hunting Time BIP39 target-page scan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hunting-time-bip39-target-scan.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunting-time-bip39-target-page-scan-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Scan all BIP39 words for printed pages 103, 110 and 241
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import concurrent.futures, json, random, threading, time, urllib.parse, urllib.request
          from pathlib import Path

          ASIN='B0FRGB2PMR'
          ENDPOINT='https://read.amazon.com/sample/print/search-results'
          WORDLIST_URL='https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt'
          TARGET_LABELS={'Page 103','Page 110','Page 241'}
          TARGET_INTERNAL={'112','119','250'}
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          OUT=Path('public-media-analysis/bip39-target-pages')
          OUT.mkdir(parents=True,exist_ok=True)

          req=urllib.request.Request(WORDLIST_URL,headers={'User-Agent':UA})
          with urllib.request.urlopen(req,timeout=30) as r:
              words=[line.strip() for line in r.read().decode().splitlines() if line.strip()]
          assert len(words)==2048, len(words)
          order={word:i for i,word in enumerate(words)}
          lock=threading.Lock(); completed=0

          def walk(value):
              found=[]
              if isinstance(value,list):
                  strings=[str(x) for x in value]
                  if TARGET_LABELS.intersection(strings): found.append(value)
                  for child in value: found.extend(walk(child))
              elif isinstance(value,dict):
                  for child in value.values(): found.extend(walk(child))
              return found

          def one(word):
              nonlocal completed
              params={'asin':ASIN,'buyingAsin':ASIN,'query':word,'pageNumber':1,'pageSize':100}
              url=ENDPOINT+'?'+urllib.parse.urlencode(params)
              row=None
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(url,headers={
                          'Accept':'application/json','User-Agent':UA,
                          'Referer':f'https://read.amazon.com/kp/card?asin={ASIN}&preview=inline&linkCode=kpe'})
                      with urllib.request.urlopen(request,timeout=45) as response:
                          body=json.loads(response.read())
                      hits=[]
                      for entry in walk(body):
                          strings=[str(x) for x in entry]
                          label=next((x for x in strings if x in TARGET_LABELS),None)
                          internal=next((x for x in strings if x in TARGET_INTERNAL),None)
                          hits.append({'label':label,'internalPage':internal,'entry':entry})
                      row={'word':word,'status':200,'totalResults':body.get('totalResults'),'hits':hits}
                      break
                  except Exception as exc:
                      if attempt==4:
                          row={'word':word,'status':'error','error':repr(exc),'hits':[]}
                      else:
                          time.sleep(0.4*(2**attempt)+random.random()*0.3)
              with lock:
                  completed+=1
                  if completed%100==0: print(f'completed {completed}/2048',flush=True)
              return row

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              rows=list(pool.map(one,words))

          target_rows=sorted((r for r in rows if r['hits']),key=lambda r:order[r['word']])
          errors=[r for r in rows if r['status']=='error']
          by_page={label:[] for label in sorted(TARGET_LABELS,key=lambda x:int(x.split()[-1]))}
          for row in target_rows:
              for hit in row['hits']:
                  if hit['label']:
                      by_page[hit['label']].append({
                          'word':row['word'],'internalPage':hit['internalPage'],
                          'entry':hit['entry'],'totalResults':row.get('totalResults')})

          result={'runId':'${{ github.run_id }}','wordsQueried':len(words),'errorCount':len(errors),
                  'targetWordCount':len(target_rows),'byPage':by_page,'errors':errors}
          (OUT/'target-words.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          (OUT/'all-query-status.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          lines=['# BIP39 target-page scan','',f'- queried: {len(words)}',f'- errors: {len(errors)}',
                 f'- words hitting a target page: {len(target_rows)}','']
          for label,items in by_page.items():
              lines += [f'## {label}','']
              lines += [f"- `{x['word']}` — internal {x.get('internalPage')}; `{json.dumps(x['entry'],ensure_ascii=False)}`" for x in items]
              if not items: lines.append('_No hit._')
              lines.append('')
          (OUT/'target-words.md').write_text('\n'.join(lines))
          print((OUT/'target-words.md').read_text())
          PY

      - name: Upload complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-bip39-target-page-scan
          path: public-media-analysis/bip39-target-pages
          if-no-files-found: warn
          retention-days: 7

      - name: Persist concise result on research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f public-media-analysis/bip39-target-pages/target-words.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/bip39-target-pages/target-words.json
          git add public-media-analysis/bip39-target-pages/target-words.md
          git commit -m "research: persist BIP39 target-page scan $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
