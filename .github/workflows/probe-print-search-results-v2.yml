name: Probe actual paperback search results

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/probe-print-search-results-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Query paperback search endpoint
        shell: bash
        run: |
          set -euo pipefail
          out=public-media-analysis/print-search-v2
          rm -rf "$out"; mkdir -p "$out"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card='https://read.amazon.com/sample/B0FRGB2PMR?clientId=share'
          curl -L --compressed --retry 3 -sS -A "$ua" -c "$out/cookies.txt" "$card" -o "$out/card.html"
          python - <<'PY'
          import json,subprocess,urllib.parse
          from pathlib import Path
          out=Path('public-media-analysis/print-search-v2')
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          card='https://read.amazon.com/sample/B0FRGB2PMR?clientId=share'
          endpoint='https://read.amazon.com/sample/print/search-results'
          queries=['surface','device','radio','group','shoulder','apology','price','when','where','time','watch','view','target','vehicle','car','drive','pilot','flight','cockpit','jungle','road','black','electric','power']
          rows=[]
          for q in queries:
            params={'asin':'B0FRGB2PMR','buyingAsin':'B0FRGB2PMR','query':q,'pageNumber':1,'pageSize':100}
            url=endpoint+'?'+urllib.parse.urlencode(params)
            body=out/f'{q}.json'; hdr=out/f'{q}.headers'
            p=subprocess.run(['curl','-L','--compressed','--retry','3','-sS','-A',ua,'-b',str(out/'cookies.txt'),'-c',str(out/'cookies.txt'),'-e',card,'-H','Accept: application/json','-D',str(hdr),url,'-o',str(body),'-w','%{http_code}\t%{content_type}'],capture_output=True,text=True)
            raw=body.read_bytes() if body.exists() else b''
            rec={'query':q,'url':url,'status':p.stdout.strip(),'bytes':len(raw),'stderr':p.stderr.strip()}
            try: rec['json']=json.loads(raw)
            except Exception as e: rec['parse_error']=repr(e); rec['prefix']=raw[:500].decode('utf-8','replace')
            rows.append(rec); print(json.dumps(rec,ensure_ascii=False)[:4000],flush=True)
          (out/'results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - name: Persist results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/print-search-v2 || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist actual paperback search results $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
