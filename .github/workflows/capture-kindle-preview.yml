name: Capture public Kindle sample surface

on:
  push:
    branches:
      - research/public-media-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Capture public preview HTML, DOM, screenshot, and network log
        run: |
          set -euxo pipefail
          out=public-media-analysis/kindle-preview
          mkdir -p "$out"
          card='https://read.amazon.com/kp/card?asin=B0FK7RBDFL&preview=inline&linkCode=kpe'
          embed='https://read.amazon.com/kp/embed?asin=B0FK7RBDFL&preview=newtab&linkCode=kpe'
          curl --fail --location --compressed --dump-header "$out/card.headers" "$card" -o "$out/card.html" || true
          curl --fail --location --compressed --dump-header "$out/embed.headers" "$embed" -o "$out/embed.html" || true
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -n "$CHROME" ]; then
            timeout 90s "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --window-size=1440,1200 --virtual-time-budget=30000 \
              --log-net-log="$out/netlog.json" --net-log-capture-mode=IncludeSensitive \
              --dump-dom "$card" > "$out/card.dom.html" 2> "$out/chrome.stderr" || true
            timeout 90s "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --window-size=1440,1200 --virtual-time-budget=30000 \
              --screenshot="$out/card.png" "$card" >> "$out/chrome.stderr" 2>&1 || true
          fi
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Persist text diagnostics only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/kindle-preview/*.html public-media-analysis/kindle-preview/*.headers public-media-analysis/kindle-preview/*.stderr public-media-analysis/kindle-preview/netlog.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'research: add public Kindle preview diagnostics'
          git push origin HEAD:research/public-media-analysis
      - name: Upload full capture
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-kindle-preview-capture
          path: public-media-analysis/kindle-preview
          retention-days: 7
