name: Export recovered clue evidence

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/export-public-media.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis
      - name: Inventory evidence
        run: find public-media-analysis -maxdepth 3 -type f -print | sort
      - name: Upload recovered clue evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovered-clue-evidence
          path: public-media-analysis
          if-no-files-found: error
          retention-days: 1
      - name: Persist export run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > public-media-analysis/latest-export-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/latest-export-run-id.txt
          git commit -m 'research: record clue export run [skip ci]'
          git push origin HEAD:research/public-media-analysis
