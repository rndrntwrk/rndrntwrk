name: Export target paperback preview scans

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/export-target-page-images-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Download byte-verified public preview scans
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests pillow
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import requests
          from PIL import Image

          root = Path('public-media-analysis')
          summary_path = root / 'target-pages' / 'summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          out = Path('target-page-scan-export')
          out.mkdir(parents=True, exist_ok=True)

          manifest = []
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0'})
          for item in summary.get('downloadedImages', []):
              page = int(item['page'])
              url = item['url']
              response = session.get(url, timeout=60)
              response.raise_for_status()
              data = response.content
              digest = hashlib.sha256(data).hexdigest()
              expected = item.get('sha256')
              if expected and digest != expected:
                  raise SystemExit(f'sha256 mismatch for page {page}: {digest} != {expected}')
              path = out / f'scan-{page:03d}.jpg'
              path.write_bytes(data)
              with Image.open(path) as image:
                  size = list(image.size)
              manifest.append({
                  'page': page,
                  'file': path.name,
                  'bytes': len(data),
                  'sha256': digest,
                  'size': size,
              })
              print(page, len(data), size, digest)

          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (out / 'source-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(f'exported {len(manifest)} scans')
          PY

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-target-page-scans
          path: target-page-scan-export
          if-no-files-found: error
          retention-days: 7
