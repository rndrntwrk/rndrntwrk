name: Enumerate BIP39 words on corrected Hunting Time print pages

on:
  push:
    branches:
      - research/public-media-analysis
    paths:
      - .github/workflows/enumerate-bip39-corrected-print-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/public-media-analysis

      - name: Install asynchronous HTTP client
        run: python -m pip install --disable-pip-version-check -q aiohttp

      - name: Validate offset and enumerate target pages
        shell: bash
        run: |
          set -euo pipefail
          out=public-media-analysis/bip39-corrected-pages
          rm -rf "$out"
          mkdir -p "$out"
          cat > /tmp/enumerate.py <<'PY'
          from __future__ import annotations
          import asyncio, json, random, time
          from collections import Counter, defaultdict
          from pathlib import Path
          import aiohttp

          ASIN='B0FRGB2PMR'
          ENDPOINT='https://read.amazon.com/sample/print/position-data'
          CARD='https://read.amazon.com/sample/B0FRGB2PMR?clientId=share'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          OUT=Path('public-media-analysis/bip39-corrected-pages')
          WORDLIST=Path('public-media-analysis/wordlists/bip39-english.txt')
          words=[w.strip() for w in WORDLIST.read_text().splitlines() if w.strip()]
          if len(words)!=2048: raise SystemExit(f'expected 2048 words, got {len(words)}')

          # Printed page -> Amazon endpoint/image page. The body pages use a +9 offset.
          mapping={14:23,19:28,21:30,24:33,32:41,103:112,110:119,241:250}
          controls={
            14:['iron','black','metal','way','gold','silver','bronze','age','lost'],
            19:['radio','device','machine','network','position','connect','angle','attack','advance','calm','blue'],
            21:['unit','group','pair','machine','steel','attack','air','journey','jungle','enemy','aim'],
            24:['surface','wall','world','time','edge','whale','blue','orange','current','prize','turtle','stone'],
            32:['road','car','wall','window','screen','mobile','light','stone','trip','street'],
          }

          timeout=aiohttp.ClientTimeout(total=25,connect=10,sock_read=15)
          connector=aiohttp.TCPConnector(limit=18,ttl_dns_cache=300)
          semaphore=asyncio.Semaphore(14)
          statuses=Counter(); errors=[]; positives=defaultdict(list); lock=asyncio.Lock(); completed=0
          started=time.time()

          async def query(session, printed_page, endpoint_page, word, phase):
            nonlocal completed
            params={'asin':ASIN,'query':word,'token':'null','page':str(endpoint_page)}
            last=None
            for attempt in range(5):
              try:
                async with semaphore:
                  async with session.get(ENDPOINT,params=params,timeout=timeout) as r:
                    text=await r.text(); status=r.status; ct=r.headers.get('content-type','')
                statuses[f'{status} {ct.split(";")[0]}']+=1
                if status in (429,500,502,503,504):
                  last=f'HTTP {status}: {text[:180]}'
                  await asyncio.sleep(0.5*(2**attempt)+random.random()*0.3)
                  continue
                try: obj=json.loads(text)
                except Exception as e:
                  last=f'JSON {e!r}: {text[:180]}'; break
                hs=obj.get('highlights') if isinstance(obj,dict) else None
                count=sum(len(v) for v in hs.values() if isinstance(v,list)) if isinstance(hs,dict) else 0
                if count:
                  positives[printed_page].append({'word':word,'endpoint_page':endpoint_page,'highlight_count':count,'highlights':hs,'phase':phase})
                last=None; break
              except Exception as e:
                last=repr(e); await asyncio.sleep(0.5*(2**attempt)+random.random()*0.3)
            async with lock:
              completed+=1
              if last: errors.append({'printed_page':printed_page,'endpoint_page':endpoint_page,'word':word,'phase':phase,'error':last})
              if completed%500==0:
                print(f'completed={completed} positives={sum(map(len,positives.values()))} errors={len(errors)} elapsed={time.time()-started:.1f}s',flush=True)

          async def main():
            jar=aiohttp.CookieJar(unsafe=True)
            async with aiohttp.ClientSession(headers={'User-Agent':UA,'Accept':'application/json,text/html,*/*'},cookie_jar=jar,connector=connector) as session:
              async with session.get(CARD) as r: await r.read(); print('card',r.status,r.url,flush=True)
              # First validate the +9 mapping using highly diagnostic words.
              for printed, qs in controls.items():
                await asyncio.gather(*(query(session,printed,mapping[printed],w,'control') for w in qs))
                print('CONTROL',printed,mapping[printed],[x['word'] for x in positives[printed]],flush=True)
              # Only continue if at least three control pages produce hits. Still record a failure cleanly.
              pages_with_control_hits=sum(bool(positives[p]) for p in controls)
              if pages_with_control_hits < 3:
                print('OFFSET VALIDATION FAILED',pages_with_control_hits,flush=True)
                return
              for printed in (103,110,241):
                endpoint_page=mapping[printed]
                for start in range(0,len(words),256):
                  await asyncio.gather(*(query(session,printed,endpoint_page,w,'enumeration') for w in words[start:start+256]))
                positives[printed].sort(key=lambda x:x['word'])
                print('TARGET',printed,endpoint_page,[x['word'] for x in positives[printed]],flush=True)

          asyncio.run(main())
          summary={
            'run_id':None,'asin':ASIN,'mapping':{str(k):v for k,v in mapping.items()},
            'wordlist_size':len(words),'completed_requests':completed,
            'status_counts':dict(statuses),'error_count':len(errors),
            'control_hits':{str(p):[x['word'] for x in positives[p] if x['phase']=='control'] for p in controls},
            'target_words':{str(p):[x['word'] for x in positives[p] if x['phase']=='enumeration'] for p in (103,110,241)},
            'details':{str(p):positives[p] for p in mapping},
            'elapsed_seconds':time.time()-started,
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          (OUT/'errors.json').write_text(json.dumps(errors,indent=2,ensure_ascii=False))
          md=['# Corrected printed-page BIP39 enumeration','',f'- Completed requests: {completed:,}',f'- Errors: {len(errors):,}',f'- Elapsed: {summary["elapsed_seconds"]:.1f}s','']
          for p in controls:
            md += [f'## Control: printed page {p} → endpoint page {mapping[p]}','',', '.join(f'`{w}`' for w in summary['control_hits'][str(p)]) or '_No hits._','']
          for p in (103,110,241):
            md += [f'## Target: printed page {p} → endpoint page {mapping[p]}','',', '.join(f'`{w}`' for w in summary['target_words'][str(p)]) or '_No BIP39 words returned._','']
          (OUT/'summary.md').write_text('\n'.join(md)+'\n')
          print(json.dumps(summary,indent=2,ensure_ascii=False),flush=True)
          PY
          python /tmp/enumerate.py | tee "$out/console.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/RUN_ID.txt"

      - name: Upload corrected enumeration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunting-time-bip39-corrected-pages
          path: public-media-analysis/bip39-corrected-pages
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Persist compact corrected result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-media-analysis/bip39-corrected-pages/summary.json public-media-analysis/bip39-corrected-pages/summary.md public-media-analysis/bip39-corrected-pages/RUN_ID.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist corrected page enumeration $GITHUB_RUN_ID"
          git pull --rebase origin research/public-media-analysis
          git push origin HEAD:research/public-media-analysis
